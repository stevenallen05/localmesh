
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 15000 }

node:
  id: app-b-mesh
  cluster: app-b


tracing:
  http:
    name: envoy.tracers.opentelemetry
    typed_config:
      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
      grpc_service:
        envoy_grpc: { cluster_name: otel_collector }
        timeout: 5s
      service_name: app-b-mesh

static_resources:
  listeners:
  - name: inbound
    address:
      socket_address: { address: 0.0.0.0, port_value: 15006 }
        
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
        require_client_certificate: true
        common_tls_context:
          tls_certificates:
          - certificate_chain: { filename: "/run/app-b/id.crt" }
            private_key:       { filename: "/run/app-b/id.key" }
          validation_context:
            trusted_ca: { filename: "/run/app-b/trust.ca.crt" }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: inbound
          codec_type: AUTO
          forward_client_cert_details: SANITIZE_SET
          set_current_client_cert_details:
            uri:    true
            subject: true
                    
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  ts:               "%START_TIME%"
                  method:           "%REQ(:METHOD)%"
                  path:             "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                  protocol:         "%PROTOCOL%"
                  response_code:    "%RESPONSE_CODE%"
                  bytes_received:   "%BYTES_RECEIVED%"
                  bytes_sent:       "%BYTES_SENT%"
                  duration_ms:      "%DURATION%"
                  upstream:         "%UPSTREAM_HOST%"
                  peer_spiffe_uri:  "%DOWNSTREAM_PEER_URI_SAN%"
                  request_id:       "%REQ(X-REQUEST-ID)%"
                  trace_id:         "%REQ(X-B3-TRACEID)%"
                  user_agent:       "%REQ(USER-AGENT)%"
          route_config:
            virtual_hosts:
            - name: inbound
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: app_loopback }
          http_filters:
          - name: envoy.filters.http.rbac
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
              # Foundation tier: allow-all-internal. Row 14 (cert-as-policy)
              # tightens this. TODO: needs_prod_decisions per-caller RBAC via cert OID
              rules:
                action: ALLOW
                policies:
                  allow-all:
                    permissions: [{ any: true }]
                    principals:  [{ any: true }]
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  - name: outbound
    address:
      socket_address: { address: 127.0.0.1, port_value: 15001 }
    listener_filters:
    - name: envoy.filters.listener.original_dst
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.original_dst.v3.OriginalDst
    filter_chains:
    # Catch-all: anything not matched above forwards to egress-mesh
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: outbound_catchall
          cluster: egress_mesh

  - name: stats
    address:
      socket_address: { address: 0.0.0.0, port_value: 15090 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: stats
          codec_type: AUTO
          route_config:
            virtual_hosts:
            - name: stats
              domains: ["*"]
              routes:
              - match: { prefix: "/stats/prometheus" }
                route: { cluster: admin_loopback }
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: app_loopback
    type: STATIC
    connect_timeout: 0.250s
    load_assignment:
      cluster_name: app_loopback
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 50052 }

  - name: admin_loopback
    type: STATIC
    connect_timeout: 0.250s
    load_assignment:
      cluster_name: admin_loopback
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 15000 }

  - name: egress_mesh
    type: STRICT_DNS
    connect_timeout: 0.250s
    load_assignment:
      cluster_name: egress_mesh
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: egress-mesh, port_value: 15001 }
        
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          tls_certificates:
          - certificate_chain: { filename: "/run/app-b/id.crt" }
            private_key:       { filename: "/run/app-b/id.key" }
          validation_context:
            trusted_ca: { filename: "/run/app-b/trust.ca.crt" }

    
  - name: otel_collector
    type: STRICT_DNS
    connect_timeout: 1s
    http2_protocol_options: {}
    load_assignment:
      cluster_name: otel_collector
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: otel-collector, port_value: 4317 }
