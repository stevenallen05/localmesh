
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 15000 }

node:
  id: ingress-mesh
  cluster: ingress-mesh


tracing:
  http:
    name: envoy.tracers.opentelemetry
    typed_config:
      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
      grpc_service:
        envoy_grpc: { cluster_name: otel_collector }
        timeout: 5s
      service_name: ingress-mesh

static_resources:
  listeners:
  - name: ingress
    address:
      socket_address: { address: 0.0.0.0, port_value: 8443 }
        
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
        common_tls_context:
          tls_certificates:
          - certificate_chain: { filename: "/run/ingress-mesh/id.crt" }
            private_key:       { filename: "/run/ingress-mesh/id.key" }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress
          codec_type: AUTO
                    
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  ts:               "%START_TIME%"
                  method:           "%REQ(:METHOD)%"
                  path:             "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                  protocol:         "%PROTOCOL%"
                  response_code:    "%RESPONSE_CODE%"
                  bytes_received:   "%BYTES_RECEIVED%"
                  bytes_sent:       "%BYTES_SENT%"
                  duration_ms:      "%DURATION%"
                  upstream:         "%UPSTREAM_HOST%"
                  peer_spiffe_uri:  "%DOWNSTREAM_PEER_URI_SAN%"
                  request_id:       "%REQ(X-REQUEST-ID)%"
                  trace_id:         "%REQ(X-B3-TRACEID)%"
                  user_agent:       "%REQ(USER-AGENT)%"
          route_config:
            virtual_hosts:
            - name: app-a-mesh
              domains: ["app-a.sample-mesh.lvh.me"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: app-a-mesh }
            - name: envoy_admin
              domains: ["envoy.sample-mesh.lvh.me"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: ingress_self_admin }
              - match: { prefix: "/workload/app-a-mesh/" }
                route: { cluster: app-a-mesh_admin, prefix_rewrite: "/" }
              - match: { prefix: "/workload/app-b-mesh/" }
                route: { cluster: app-b-mesh_admin, prefix_rewrite: "/" }
              - match: { prefix: "/workload/egress-mesh/" }
                route: { cluster: egress-mesh_admin, prefix_rewrite: "/" }
          http_filters:
          - name: envoy.filters.http.oauth2
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.oauth2.v3.OAuth2
              config:
                token_endpoint:
                  cluster: dex
                  uri: ${DEX_ISSUER}/token
                  timeout: 5s
                authorization_endpoint: ${DEX_ISSUER}/auth
                redirect_uri: "https://www.sample-mesh.lvh.me:8443/oauth2/callback"
                redirect_path_matcher: { path: { exact: /oauth2/callback } }
                signout_path: { path: { exact: /oauth2/signout } }
                credentials:
                  client_id: ${OIDC_CLIENT_ID}
                  token_secret: { name: client-secret }
                  hmac_secret:  { name: hmac-secret }
                auth_scopes: [ openid, email, profile ]
                # Skip auth on dex.*, envoy.*, grafana.*
                pass_through_matcher:
                - name: ":authority"
                  string_match: { exact: "envoy.sample-mesh.lvh.me" }
          - name: envoy.filters.http.jwt_authn
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
              providers:
                dex:
                  issuer: ${DEX_ISSUER}
                  remote_jwks: { http_uri: { uri: ${DEX_JWKS_URI}, cluster: dex, timeout: 5s }, cache_duration: { seconds: 300 } }
                  forward: true
                  payload_in_metadata: jwt_claims
                  claim_to_headers:
                  - { header_name: x-user-id,    claim_name: sub }
                  - { header_name: x-user-email, claim_name: email }
                  - { header_name: x-user-name,  claim_name: preferred_username }
              rules:
              - match: { prefix: "/" }
                requires: { provider_name: dex }
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  - name: stats
    address: { socket_address: { address: 0.0.0.0, port_value: 15090 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: stats
          codec_type: AUTO
          route_config:
            virtual_hosts:
            - name: stats
              domains: ["*"]
              routes:
              - match: { prefix: "/stats/prometheus" }
                route: { cluster: admin_loopback }
          http_filters:
          - name: envoy.filters.http.router
            typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }

  clusters:
  - name: app-a-mesh
    type: STRICT_DNS
    connect_timeout: 1s
    http2_protocol_options: {}
    load_assignment:
      cluster_name: app-a-mesh
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: app-a-mesh, port_value: 3000 }
    
        
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          tls_certificates:
          - certificate_chain: { filename: "/run/ingress-mesh/id.crt" }
            private_key:       { filename: "/run/ingress-mesh/id.key" }
          validation_context:
            trusted_ca: { filename: "/run/ingress-mesh/trust.ca.crt" }
    

  - name: dex
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: dex
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: dex, port_value: 5556 }

  - name: ingress_self_admin
    type: STATIC
    connect_timeout: 0.250s
    load_assignment:
      cluster_name: ingress_self_admin
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 15000 }

  - name: admin_loopback
    type: STATIC
    connect_timeout: 0.250s
    load_assignment:
      cluster_name: admin_loopback
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 15000 }
  - name: app-a-mesh_admin
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: app-a-mesh_admin
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: app-a-mesh, port_value: 15000 }
  - name: app-b-mesh_admin
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: app-b-mesh_admin
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: app-b-mesh, port_value: 15000 }
  - name: egress-mesh_admin
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: egress-mesh_admin
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: egress-mesh, port_value: 15000 }

    
  - name: otel_collector
    type: STRICT_DNS
    connect_timeout: 1s
    http2_protocol_options: {}
    load_assignment:
      cluster_name: otel_collector
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: otel-collector, port_value: 4317 }

secrets:
- name: client-secret
  generic_secret: { secret: { inline_string: "${OIDC_CLIENT_SECRET}" } }
- name: hmac-secret
  generic_secret: { secret: { inline_string: "${OAUTH2_HMAC_SECRET}" } }
