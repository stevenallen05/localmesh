# `localmesh/service_catalog/` is inlined in this repo for demo legibility. In a real
# org this would arrive from a git owned by ops.

name: ${PROJECT_NAME}

include:
  - path: localmesh/bundled.compose.yaml

services:
  www:
    # Same reason as server: proto/ must be in the build context.
    build:
      context: .
      dockerfile: www/Dockerfile
    image: metrics-stack/www:0.1.0  # Rule 1
    restart: unless-stopped
    environment:
      # Delivered by the redis plugin's connection_url export. The destination
      # name (CACHE_URL) is chosen by the consumer in deploy.toml, not the
      # plugin — the plugin only knows the value shape.
      REDIS_URL: ${CACHE_URL}
    ports:
      - 3443:3443
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Plaintext loopback probe against the app's declared port. Loopback
      # is not intercepted by the sidecar's inbound redirect.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3443/"]
      interval: 10s
      timeout: 3s
      retries: 5

  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: metrics-collector-devcontainer

    profiles:
      - donotstart
    volumes:
      - .:/workspace:cached

      # host docker access
      - /var/run/docker.sock:/var/run/docker.sock

    working_dir: /workspace

    command: sleep infinity
    environment:
      GOPATH: /go

    tty: true