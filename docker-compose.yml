# `localmesh/service_catalog/` is inlined in this repo for demo legibility. In a real
# org this would arrive from a git owned by ops

name: ${PROJECT_NAME}

include:
  - path: localmesh/bundled.compose.yaml

services:
  server:
    # build.context: . so build.rs can reach ../proto/ at tonic-build time.
    build:
      context: .
      dockerfile: server/Dockerfile
    image: metrics-stack/server:0.1.0  # Rule 1
    restart: unless-stopped
    environment:
      # Bind the declared gRPC port on all interfaces. The server-mesh
      # kuma-dp sidecar shares this netns and intercepts inbound :50051
      # (transparent proxy), terminating mTLS before forwarding here.
      SERVER_BIND_ADDR: 0.0.0.0:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: server
      # `owned_by` interpolates from .env's TECH_LEAD_EMAIL, which
      # mirrors project.toml's tech_lead. Eventually the platform reads
      # project.toml directly and this duplication goes away.
      # service.namespace / deployment.environment.name are OTel semconv
      # identity attrs that the imported APM dashboard reads.
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=${PROJECT_NAME},deployment.environment.name=dev,module_name=app,owned_by=${TECH_LEAD_EMAIL}"
      # Connection-string wiring is in place ahead of an actual postgres
      # client; what the server uses postgres for is still TBD. Server today
      # ignores this — when an RPC lands that needs it, the env is ready.
      # LocalMesh mTLS to postgres: cert auth via CN=server (the SPIFFE
      # workload name matches the postgres role declared in
      # localmesh/service_catalog/postgres16/initdb/00-roles.sql).
      DATABASE_URL: postgres://server@postgres:5432/app?sslmode=verify-full&sslrootcert=/run/server/trust.ca.crt&sslcert=/run/server/id.crt&sslkey=/run/server/id.key
    secrets:
      # LocalMesh cert material for the server workload. App uses it for
      # outbound postgres mTLS (sqlx reads sslcert/sslkey via DATABASE_URL).
      # Inbound gRPC mTLS lives in the server-mesh envoy sidecar; that
      # service mounts the same triple via the mesh plugin's compose.
      - source: server_id_crt
        target: /run/server/id.crt
        mode: 0444
      - source: server_id_key
        target: /run/server/id.key
        mode: 0444
      - source: server_trust_ca
        target: /run/server/trust.ca.crt
        mode: 0444
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # bash built-in TCP test against the app's declared port. Loopback
      # is not intercepted by the sidecar's inbound redirect, so this
      # probes the app directly. (Confirm during bring-up; see plan §3.)
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/50051"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      # Rule 2: prod would split services into per-team charts; PoC keeps one
      # chart and tags server as the application identity.
      katenary.v3/main-app: "true"
      # Rule 3: depends_on target needs a port label or katenary rc6 emits no chart.
      katenary.v3/ports: |-
        - 50051
      # Identity for the `service` label on cadvisor metrics + Loki logs.
      # See localmesh/service_catalog/observability/docker-compose.yml's cadvisor
      # metric_relabel_configs for the propagation rule. Same value as
      # OTEL_SERVICE_NAME above so metrics + traces + logs all agree.
      metrics.service_name: server
      # Identity channel for the Vector log-enrichment agent. Mirrors
      # OTEL_RESOURCE_ATTRIBUTES above (the SDK channel for traces/metrics).
      # One source of truth for both channels is a follow-up — see
      # DESIGN_DECISIONS Open / TODO.md "Identity source consolidation."
      metrics.module_name: app
      metrics.owned_by: ${TECH_LEAD_EMAIL}

  www:
    # Same reason as server: proto/ must be in the build context.
    build:
      context: .
      dockerfile: www/Dockerfile
    image: metrics-stack/www:0.1.0  # Rule 1
    restart: unless-stopped
    environment:
      # gRPC dials the platform-supplied peer address. The kuma DP DNS
      # resolves this mesh DNS form to the server MeshService VIP, and
      # the www-mesh sidecar's outbound cluster mTLS-upgrades the dial.
      # Apps treat this as an opaque address; the platform owns the mesh
      # naming scheme. (Bare docker name `server:50051` would resolve via
      # docker DNS to the pod IP, miss the mesh cluster, and be refused
      # by server's STRICT mTLS inbound — see DESIGN_DECISIONS.)
      SERVER_ADDR: server.svc.mesh.local:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: www
      # See note on server above — same TECH_LEAD_EMAIL interpolation.
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=${PROJECT_NAME},deployment.environment.name=dev,module_name=app,owned_by=${TECH_LEAD_EMAIL}"
      # @opentelemetry/instrumentation-http emits the legacy `http.server.duration`
      # (ms) by default; the imported APM dashboard queries the stable
      # `http.server.request.duration` (seconds). Opt in.
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      HOSTNAME: ${HOSTNAME:-}
      # The www-mesh kuma-dp sidecar shares this netns and intercepts
      # inbound :3443 (transparent proxy), terminating mTLS before
      # forwarding here.
      WWW_PORT: 3443
    # No host port mapping — ingress-mesh is the only ingress. The
    # www-mesh sidecar exposes :3443 on the shared netns for it to dial.
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # Plaintext loopback probe against the app's declared port. Loopback
      # is not intercepted by the sidecar's inbound redirect. (Confirm
      # during bring-up; see plan §3.)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3443/"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      # Rule 6: domain comes from .env's EXTERNAL_DOMAIN, mirroring
      # project.toml's external_domain. Prod overlay can still override.
      katenary.v3/ingress: |-
        hostname: ${EXTERNAL_DOMAIN}
        port: 3000
      metrics.service_name: www
      metrics.module_name: app
      metrics.owned_by: ${TECH_LEAD_EMAIL}

