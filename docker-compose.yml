# `service_catalog/` is inlined in this repo for demo legibility. In a real
# org this would arrive either from an ops-team git repo (vendored, or via
# git submodule / sparse-checkout) or a katenary plugin provided by ops.
include:
  - path: service_catalog/required.compose.yaml

services:
  server:
    # build.context: . so build.rs can reach ../proto/ at tonic-build time.
    build:
      context: .
      dockerfile: server/Dockerfile
    image: metrics-stack/server:0.1.0  # Rule 1
    environment:
      SERVER_ADDR: 0.0.0.0:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: server
      GRAFANA_API_URL: http://grafana:3000
      GRAFANA_API_TOKEN_FILE: /run/grafana/token
    volumes:
      - grafana-token:/run/grafana:ro
    depends_on:
      otel-collector:
        condition: service_started
      grafana-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      # bash built-in TCP test — no extra packages on bookworm.
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/50051"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      # Rule 2: prod would split services into per-team charts; PoC keeps one
      # chart and tags server as the application identity.
      katenary.v3/main-app: "true"
      # Rule 3: depends_on target needs a port label or katenary rc6 emits no chart.
      katenary.v3/ports: |-
        - 50051

  www:
    # Same reason as server: proto/ must be in the build context.
    build:
      context: .
      dockerfile: www/Dockerfile
    image: metrics-stack/www:0.1.0  # Rule 1
    environment:
      # Rule 4 rewrites this to `{{ .Release.Name }}-server:50051` in k8s.
      SERVER_ADDR: server:50051
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: www
      HOSTNAME: ${HOSTNAME:-}
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      # BusyBox wget ships in Node alpine.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      katenary.v3/map-env: |-
        SERVER_ADDR: '{{ .Release.Name }}-server:50051'
      # Rule 6: placeholder domain — prod overlay injects the real hostname.
      katenary.v3/ingress: |-
        hostname: ${HOSTNAME:-}
        port: 3000
