# `localmesh/service_catalog/` is inlined in this repo for demo legibility. In a real
# org this would arrive from a git owned by ops

name: ${PROJECT_NAME}

include:
  - path: localmesh/bundled.compose.yaml

services:
  server:
    # build.context: . so build.rs can reach ../proto/ at tonic-build time.
    build:
      context: .
      dockerfile: server/Dockerfile
    image: metrics-stack/server:0.1.0  # Rule 1
    restart: unless-stopped
    environment:
      FOO: bar
    # secrets:
    #   # LocalMesh cert material for the server workload. App uses it for
    #   # outbound postgres mTLS (sqlx reads sslcert/sslkey via DATABASE_URL).
    #   # Inbound gRPC mTLS lives in the server-mesh envoy sidecar; that
    #   # service mounts the same triple via the mesh plugin's compose.
    #   - source: server_id_crt
    #     target: /run/server/id.crt
    #     mode: 0444
    #   - source: server_id_key
    #     target: /run/server/id.key
    #     mode: 0444
    #   - source: server_trust_ca
    #     target: /run/server/trust.ca.crt
    #     mode: 0444
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # bash built-in TCP test against the app's declared port. Loopback
      # is not intercepted by the sidecar's inbound redirect, so this
      # probes the app directly. (Confirm during bring-up; see plan §3.)
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/50051"]
      interval: 10s
      timeout: 3s
      retries: 5

  www:
    # Same reason as server: proto/ must be in the build context.
    build:
      context: .
      dockerfile: www/Dockerfile
    image: metrics-stack/www:0.1.0  # Rule 1
    restart: unless-stopped
    environment:
      HOSTNAME: ${HOSTNAME:-}

      WWW_PORT: 3443
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # Plaintext loopback probe against the app's declared port. Loopback
      # is not intercepted by the sidecar's inbound redirect. (Confirm
      # during bring-up; see plan §3.)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3443/"]
      interval: 10s
      timeout: 3s
      retries: 5

