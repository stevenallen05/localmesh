# `service_catalog/` is inlined in this repo for demo legibility. In a real
# org this would arrive from a git owned by ops

name: ${PROJECT_NAME}

include:
  - path: service_catalog/required.compose.yaml
  - path: service_catalog/optional.compose.yaml

services:
  server:
    # build.context: . so build.rs can reach ../proto/ at tonic-build time.
    build:
      context: .
      dockerfile: server/Dockerfile
    image: metrics-stack/server:0.1.0  # Rule 1
    environment:
      # Plaintext bind on loopback. server-inbound (ghostunnel) terminates
      # mTLS on :50051 and forwards plain TCP here. App + sidecar share
      # the same netns via `network_mode: "service:server"`.
      SERVER_BIND_ADDR: 127.0.0.1:50052
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: server
      # `owned_by` interpolates from .env's TECH_LEAD_EMAIL, which
      # mirrors project.toml's tech_lead. Eventually the platform reads
      # project.toml directly and this duplication goes away.
      # service.namespace / deployment.environment.name are OTel semconv
      # identity attrs that the imported APM dashboard reads.
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=${PROJECT_NAME},deployment.environment.name=dev,module_name=app,owned_by=${TECH_LEAD_EMAIL}"
      # Connection-string wiring is in place ahead of an actual postgres
      # client; what the server uses postgres for is still TBD. Server today
      # ignores this — when an RPC lands that needs it, the env is ready.
      # LocalMesh mTLS to postgres: cert auth via CN=server (the SPIFFE
      # workload name matches the postgres role declared in
      # service_catalog/database/initdb/00-roles.sql).
      DATABASE_URL: postgres://server@postgres:5432/app?sslmode=verify-full&sslrootcert=/run/server/trust.ca.crt&sslcert=/run/server/id.crt&sslkey=/run/server/id.key
    volumes:
      # LocalMesh cert dir for the server workload. App uses it for
      # outbound postgres mTLS (sqlx reads sslcert/sslkey via DATABASE_URL).
      # Inbound gRPC mTLS now lives in the server-inbound sidecar; that
      # service mounts the same dir for ghostunnel.
      - ./.secrets/certs/server:/run/server:ro
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      # bash built-in TCP test — probes the plaintext loopback bind on
      # :50052 since the app no longer terminates TLS itself.
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/50052"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      # Rule 2: prod would split services into per-team charts; PoC keeps one
      # chart and tags server as the application identity.
      katenary.v3/main-app: "true"
      # Rule 3: depends_on target needs a port label or katenary rc6 emits no chart.
      katenary.v3/ports: |-
        - 50051
      # Identity for the `service` label on cadvisor metrics + Loki logs.
      # See service_catalog/observability/docker-compose.yml's cadvisor
      # metric_relabel_configs for the propagation rule. Same value as
      # OTEL_SERVICE_NAME above so metrics + traces + logs all agree.
      metrics.service_name: server
      # Identity channel for the Vector log-enrichment agent. Mirrors
      # OTEL_RESOURCE_ATTRIBUTES above (the SDK channel for traces/metrics).
      # One source of truth for both channels is a follow-up — see
      # DESIGN_DECISIONS Open / TODO.md "Identity source consolidation."
      metrics.module_name: app
      metrics.owned_by: ${TECH_LEAD_EMAIL}

  www:
    # Same reason as server: proto/ must be in the build context.
    build:
      context: .
      dockerfile: www/Dockerfile
    image: metrics-stack/www:0.1.0  # Rule 1
    environment:
      # gRPC dials www-outbound on the shared netns; the sidecar wraps
      # mTLS to server:50051. Value is loopback now, so no chart-time
      # rewrite is needed.
      # TODO: needs_prod_decisions katenary same-pod label for sidecars
      SERVER_ADDR: 127.0.0.1:50443
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: www
      # See note on server above — same TECH_LEAD_EMAIL interpolation.
      OTEL_RESOURCE_ATTRIBUTES: "service.namespace=${PROJECT_NAME},deployment.environment.name=dev,module_name=app,owned_by=${TECH_LEAD_EMAIL}"
      # @opentelemetry/instrumentation-http emits the legacy `http.server.duration`
      # (ms) by default; the imported APM dashboard queries the stable
      # `http.server.request.duration` (seconds). Opt in.
      OTEL_SEMCONV_STABILITY_OPT_IN: http
      HOSTNAME: ${HOSTNAME:-}
      # Plaintext bind on loopback. www-inbound (ghostunnel) terminates
      # mTLS on :3443 and forwards plain to here. App + sidecars share
      # the same netns via `network_mode: "service:www"`.
      WWW_PORT: 3444
    # No host port mapping — Caddy is the only ingress. The www-inbound
    # sidecar exposes :3443 on the shared netns for caddy's upstream.
    depends_on:
      server:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      # Plaintext loopback probe — TLS termination is in the sidecar now.
      test: ["CMD", "wget", "-qO-", "http://localhost:3444/"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      # Rule 6: domain comes from .env's EXTERNAL_DOMAIN, mirroring
      # project.toml's external_domain. Prod overlay can still override.
      katenary.v3/ingress: |-
        hostname: ${EXTERNAL_DOMAIN}
        port: 3000
      metrics.service_name: www
      metrics.module_name: app
      metrics.owned_by: ${TECH_LEAD_EMAIL}

  server-inbound:
    # ghostunnel sidecar terminating east-west mTLS on server's :50051 and
    # forwarding plain TCP to the app on 127.0.0.1:50052. Shares server's
    # netns via `network_mode: "service:server"`, so the LocalMesh DNS
    # resolution `server:50051` lands on this listener.
    image: ghostunnel/ghostunnel:v1.7.3
    restart: unless-stopped
    network_mode: "service:server"
    command:
      - server
      - --listen=:50051
      - --target=127.0.0.1:50052
      - --cert=/run/server/id.crt
      - --key=/run/server/id.key
      - --cacert=/run/server/trust.ca.crt
      # ghostunnel uses --allow-uri (not --allow-uri-san). ghostunnel's
      # URI matcher only accepts `*` as a complete path segment, so the
      # trust-domain-level glob (`spiffe://*.${PROJECT_NAME}.${LOCAL_DOMAIN}`)
      # is rejected; SPIFFE authorities have no path separator to glob.
      # List explicit peer URIs instead. www is the only caller today; new
      # callers join the list. Prod policy is per-route AuthorizationPolicy.
      - --allow-uri=spiffe://www.${PROJECT_NAME}.${LOCAL_DOMAIN}
      # Status/metrics endpoint on parent loopback; collector scrapes via
      # `server:9090` because the sidecar shares server's netns.
      - --status=127.0.0.1:9090
    volumes:
      - ./.secrets/certs/server:/run/server:ro
    depends_on:
      server:
        condition: service_started
    # TODO: needs_prod_decisions ghostunnel sidecar shape needs richer dep manager
    labels:
      metrics.service_name: ghostunnel
      metrics.module_name: mesh
      metrics.owned_by: sre@example.com
      mesh.role: inbound

  www-inbound:
    # ghostunnel sidecar terminating east-west mTLS on www's :3443 and
    # forwarding plain TCP to the app on 127.0.0.1:3444. Shares www's
    # netns via `network_mode: "service:www"`, so caddy's upstream
    # `https://www:3443` lands on this listener.
    image: ghostunnel/ghostunnel:v1.7.3
    restart: unless-stopped
    network_mode: "service:www"
    command:
      - server
      - --listen=:3443
      - --target=127.0.0.1:3444
      - --cert=/run/www/id.crt
      - --key=/run/www/id.key
      - --cacert=/run/www/trust.ca.crt
      # Only caddy reaches this listener; list its SPIFFE URI explicitly.
      # See the --allow-uri note on server-inbound for why the trust-domain
      # glob doesn't work here.
      - --allow-uri=spiffe://caddy.${PROJECT_NAME}.${LOCAL_DOMAIN}
      - --status=127.0.0.1:9090
    volumes:
      - ./.secrets/certs/www:/run/www:ro
    depends_on:
      www:
        condition: service_started
    # TODO: needs_prod_decisions ghostunnel sidecar shape needs richer dep manager
    labels:
      metrics.service_name: ghostunnel
      metrics.module_name: mesh
      metrics.owned_by: sre@example.com
      mesh.role: inbound

  www-outbound:
    # ghostunnel client-mode sidecar wrapping www's plaintext loopback gRPC
    # dial into mTLS to server:50051. Listens on 127.0.0.1:50443 (shared
    # netns with www) and connects out to server-inbound. Distinct status
    # port (:9091) from www-inbound to avoid collision in the shared netns.
    image: ghostunnel/ghostunnel:v1.7.3
    restart: unless-stopped
    network_mode: "service:www"
    command:
      - client
      - --listen=127.0.0.1:50443
      - --target=server:50051
      - --cert=/run/www/id.crt
      - --key=/run/www/id.key
      - --cacert=/run/www/trust.ca.crt
      - --verify-uri=spiffe://server.${PROJECT_NAME}.${LOCAL_DOMAIN}
      - --status=127.0.0.1:9091
    volumes:
      - ./.secrets/certs/www:/run/www:ro
    depends_on:
      www:
        condition: service_started
      server-inbound:
        condition: service_started
    # TODO: needs_prod_decisions ghostunnel sidecar shape needs richer dep manager
    labels:
      metrics.service_name: ghostunnel
      metrics.module_name: mesh
      metrics.owned_by: sre@example.com
      mesh.role: outbound
