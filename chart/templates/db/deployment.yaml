apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    katenary.v3/compose-hash: df4c78fea0d227b66cf86fb9388eb32b77eb0125
    katenary.v3/version: 3.0.0-rc6
  labels:
    {{- include "challenge.labels" . | nindent 4 }}
    katenary.v3/component: db
  name: '{{ include "challenge.fullname" . }}-db'
spec:
  replicas: {{ .Values.db.replicas }}
  selector:
    matchLabels:
      {{- include "challenge.selectorLabels" . | nindent 6 }}
      katenary.v3/component: db
  strategy: {}
  template:
    metadata:
      labels:
        {{- include "challenge.selectorLabels" . | nindent 8 }}
        katenary.v3/component: db
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: '{{ include "challenge.fullname" . }}-db'
        - secretRef:
            name: '{{ include "challenge.fullname" . }}-db'
        image: '{{ tpl .Values.db.repository.image $ }}:{{ tpl .Values.db.repository.tag $ | default "latest" }}'
        imagePullPolicy: {{ .Values.db.imagePullPolicy }}
        name: db
        {{- if .Values.db.resources }}
        resources:
          {{ .Values.db.resources | toYaml | nindent 10 }}
        {{- end }}
      {{- if .Values.pullSecrets }}
      imagePullSecrets:
      {{- .Values.pullSecrets | toYaml | nindent 6 }}
      {{- end }}
      {{- if .Values.db.nodeSelector }}
      nodeSelector:
        {{- .Values.db.nodeSelector | toYaml | nindent 8 }}
      {{- end }}
      {{- if ne .Values.db.serviceAccount "" }}
      serviceAccountName: {{ .Values.db.serviceAccount | quote }}
      {{- end }}
