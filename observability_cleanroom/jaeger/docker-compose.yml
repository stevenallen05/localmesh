# observability_cleanroom/jaeger/docker-compose.yml
services:
  jaeger:
    image: jaegertracing/jaeger:2.18.0
    container_name: jaeger
    command: ["--config", "/etc/jaeger/config.yaml"]
    ports:
      - "16686:16686"  # UI; 5-digit, "1"-prefix overflows 65535, left native
    volumes:
      - ./config.yaml:/etc/jaeger/config.yaml:ro
    restart: unless-stopped
    # OTLP 4317/4318 stay internal — Alloy ships to jaeger:4317. Not published,
    # so no clash with Alloy's published 14317/14318.
