# Auto-generated by ./localmesh_src/cmd/localmesh build — do not edit by hand.
# LocalMesh ingress auth plugin. Dex is the dev OIDC IdP; the ingress
# envoy (mesh plugin) is the OIDC client and drives the dance via its
# envoy.filters.http.oauth2 + jwt_authn filters.
#
# Dex's config lives in localmesh/dex.yaml, copied from dex.yaml.sample
# on first run (see Makefile's certs target). The dev edits the local
# copy to set staticPasswords.
#
# Mesh-exempt: dex sits outside the SPIFFE mesh (it fronts it). The
# ingress envoy reaches it plaintext on the docker network.
#
# TODO: needs_prod_decisions swap dex for prod IdP via plugin replacement

services:
    cadvisor:
        image: gcr.io/cadvisor/cadvisor:v0.52.1
        container_name: cadvisor
        privileged: true
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
            - /dev/disk/:/dev/disk:ro
        labels:
            # See node-exporter above — cadvisor serves the prometheus scrape on 8080.
            mesh.exempt: "true"
            prometheus.io/scrape: "true"
            prometheus.io/port: "8080"
            katenary.v3/ports: |-
                - 8080
            metrics.service_name: observability
            metrics.module_name: observability
            metrics.owned_by: sre@example.com
        devices:
            - /dev/kmsg
    database-collector:
        image: otel/opentelemetry-collector-contrib:0.152.0
        container_name: database-collector
        command: ["--config=/etc/otelcol-contrib/config.yaml"]
        configs:
            - source: database_collector_config
              target: /etc/otelcol-contrib/config.yaml
        depends_on:
            postgres-exporter:
                condition: service_started
        labels:
            # Sidecar is functionally part of the observability plane; share the
            # `service=observability` lens with the main collector so cluster-health
            # rolls them up together. `module_name=postgres16` though — catalog
            # attribution follows where the service is declared, not its functional
            # role; the two lenses are intentionally different on this service.
            metrics.service_name: observability
            metrics.module_name: postgres16
            metrics.owned_by: sre@example.com
    dex:
        image: ghcr.io/dexidp/dex:v2.41.1
        container_name: dex
        restart: unless-stopped
        command:
            - dex
            - serve
            - /etc/dex/config.yaml
        environment:
            PROJECT_NAME: ${PROJECT_NAME}
            LOCAL_DOMAIN: ${LOCAL_DOMAIN}
            LOCALMESH_OIDC_CLIENT_SECRET: ${LOCALMESH_OIDC_CLIENT_SECRET}
        volumes:
            # Dev-owned. Bootstrapped from dex.yaml.sample by `make certs`.
            # Path is relative to this file (localmesh/service_catalog/auth/);
            # dex.yaml lives at the localmesh/ root.
            - ./dex.yaml:/etc/dex/config.yaml:ro
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:5556/healthz"]
            interval: 10s
            timeout: 3s
            retries: 5
        labels:
            mesh.exempt: "true"
            katenary.v3/ports: |-
                - 5556
            metrics.service_name: dex
            metrics.module_name: ${AUTH_MODULE_NAME}
            metrics.owned_by: ${AUTH_OWNED_BY}
    grafana:
        image: grafana/grafana:12.4.3
        container_name: grafana
        # Grafana is `mesh.exempt: "true"` — no LocalMesh cert, plaintext on the
        # compose network. Port 3001 is published unprotected to the host so dev
        # tools (browser, `gcx`) can reach the API without the mTLS-trust dance
        # the Caddy ingress requires. Browser users typically go through the
        # ingress (`https://grafana.${PROJECT_NAME}.${LOCAL_DOMAIN}`); `gcx`
        # talks straight to 127.0.0.1:3001 with admin/admin basic auth.
        # TODO: needs_prod_decisions drop host port mapping in prod; admin API
        #   access flows through the ingress + a real IdP, not basic auth.
        ports:
            - "3001:3000"
        environment:
            GF_AUTH_ANONYMOUS_ENABLED: "true"
            GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
            # Pin admin creds explicitly. These are also Grafana's image
            # defaults, but spelling them out lets readers see the dev
            # contract without knowing the defaults, and makes a future
            # swap a one-line change. Catalogue services that call the
            # Grafana API use these via Basic Auth — see this plugin's
            # README "Calling the Grafana API" section.
            # TODO: needs_prod_decisions real IdP / SA token for API access
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
        configs:
            - source: grafana_vm_datasource
              target: /etc/grafana/provisioning/datasources/vm.yaml
            - source: grafana_tempo_datasource
              target: /etc/grafana/provisioning/datasources/tempo.yaml
            - source: grafana_loki_datasource
              target: /etc/grafana/provisioning/datasources/loki.yaml
            - source: grafana_dashboards_provider
              target: /etc/grafana/provisioning/dashboards/default.yaml
            - source: observability_dashboard_apm
              target: /etc/grafana/dashboards/observability/apm.json
            - source: observability_dashboard_cluster_health
              target: /etc/grafana/dashboards/observability/cluster-health.json
            - source: database_dashboard_postgres
              target: /etc/grafana/dashboards/database/postgres.json
        volumes:
            - grafana-data:/var/lib/grafana
        labels:
            mesh.exempt: "true"
            metrics.service_name: observability
            metrics.module_name: observability
            metrics.owned_by: sre@example.com
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
            interval: 10s
            timeout: 3s
            retries: 5
        depends_on:
            victoriametrics:
                condition: service_started
    kuma-cp:
        image: docker.io/kumahq/kuma-cp:2.9.0
        environment:
            KUMA_MODE: standalone
            KUMA_ENVIRONMENT: universal
            KUMA_STORE_TYPE: memory
            KUMA_API_SERVER_HTTP_INTERFACE: 0.0.0.0
            KUMA_API_SERVER_HTTP_PORT: "5681"
            KUMA_DP_SERVER_PORT: "5678"
            KUMA_DP_SERVER_AUTH_TYPE: none
            # DP-server TLS: no dedicated disable flag in Kuma 2.9. Leaving
            # KUMA_DP_SERVER_TLS_CERT_FILE / _KEY_FILE (and the general.* fallbacks)
            # unset causes kuma-cp to serve the DP-server over plain gRPC.
        expose:
            - "5678"
            - "5681"
    loki:
        image: grafana/loki:3.3.2
        container_name: loki
        command: ["-config.file=/etc/loki/loki.yaml"]
        configs:
            - source: loki_config
              target: /etc/loki/loki.yaml
        volumes:
            - loki-data:/loki
        labels:
            # Internal-only port; katenary needs the explicit declaration to
            # generate the depends_on init-container in the helm chart.
            mesh.exempt: "true"
            katenary.v3/ports: |-
                - 3100
            metrics.service_name: logging
            metrics.module_name: logging
            metrics.owned_by: sre@example.com
        # Loki image is distroless — no wget/curl/shell. Use service_started
        # ordering; the otel-collector's loki exporter will retry on its own
        # if Loki isn't accepting writes yet.
    node-exporter:
        image: prom/node-exporter:v1.8.2
        container_name: node-exporter
        command:
            - '--path.procfs=/host/proc'
            - '--path.rootfs=/rootfs'
            - '--path.sysfs=/host/sys'
            - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
        volumes:
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /:/rootfs:ro
        labels:
            # No `ports:` block (internal-only — otel-collector scrapes 9100 over
            # the docker network). Katenary needs a port to generate the
            # depends_on readiness init-container; declare it here. See
            # https://repo.katenary.io/katenary/katenary/issues/182.
            mesh.exempt: "true"
            prometheus.io/scrape: "true"
            prometheus.io/port: "9100"
            katenary.v3/ports: |-
                - 9100
            metrics.service_name: observability
            metrics.module_name: observability
            metrics.owned_by: sre@example.com
    otel-collector:
        image: otel/opentelemetry-collector-contrib:0.152.0
        container_name: otel-collector
        command: ["--config=/etc/otelcol-contrib/config.yaml"]
        # Reading the docker socket needs either root or membership in the
        # host `docker` group. Same trade-off vector made in logging/. Mount
        # is read-only; prod uses kubernetes_sd_configs and the socket goes
        # away.
        # TODO: needs_prod_decisions docker socket scope; prod uses kubernetes_sd_configs
        user: "0:0"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        labels:
            # Whole catalog module collapses to one row in service-glance.
            # See cadvisor metric_relabel_configs in this file.
            mesh.exempt: "true"
            metrics.service_name: observability
            metrics.module_name: observability
            metrics.owned_by: sre@example.com
        configs:
            - source: otel_collector_config
              target: /etc/otelcol-contrib/config.yaml
        depends_on:
            victoriametrics:
                condition: service_started
            node-exporter:
                condition: service_started
            cadvisor:
                condition: service_started
    postgres:
        build:
            context: ./service_catalog/postgres16
            dockerfile: Dockerfile
        image: metrics-stack/postgres-pgtracing:0.1.0 # pinned tag, see root Rule 1
        container_name: postgres
        environment:
            POSTGRES_DB: app
            POSTGRES_USER: postgres
            # The postgres image's entrypoint refuses to initdb without one of
            # POSTGRES_PASSWORD or POSTGRES_HOST_AUTH_METHOD. We override pg_hba
            # via the file mount anyway, so the generated default is irrelevant;
            # setting trust here just satisfies the entrypoint's check.
            POSTGRES_HOST_AUTH_METHOD: trust
            OTEL_RESOURCE_ATTRIBUTES: "module_name=postgres16,owned_by=sre@example.com"
            OTEL_SERVICE_NAME: postgres
        # Wrap the image's entrypoint: copy cert files (delivered via docker
        # compose secrets at /run/postgres/) into a postgres-owned location
        # with the strict perms postgres requires (0600 on .key, owned by the
        # postgres user). Compose secrets land at the target path with the
        # mode declared below, but postgres still requires uid match on .key,
        # so the install step stays.
        #
        # TODO: needs_prod_decisions cert delivery in prod (cert-manager Secret
        # mount, SPIRE Workload API, or sidecar copy) makes this gymnastics
        # unnecessary.
        entrypoint:
            - bash
            - -c
            - |
              set -e
              mkdir -p /etc/postgres-ssl
              install -m 0600 -o postgres -g postgres /run/postgres/id.key  /etc/postgres-ssl/server.key
              install -m 0644 -o postgres -g postgres /run/postgres/id.crt  /etc/postgres-ssl/server.crt
              install -m 0644 -o postgres -g postgres /run/postgres/trust.ca.crt /etc/postgres-ssl/root.crt
              exec /usr/local/bin/docker-entrypoint.sh "$@"
            - --
        command:
            - postgres
            # Point at our own config + hba files; the postgres image's defaults
            # are overridden so we can require mTLS at the auth layer. SSL paths
            # land inside /etc/postgres-ssl/ thanks to the entrypoint wrapper
            # (see above) — postgresql.conf is updated to match.
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
            # Load the extension up-front; it has to be listed in
            # shared_preload_libraries before CREATE EXTENSION will succeed.
            - -c
            - shared_preload_libraries=pg_tracing,pg_stat_statements
            # pg_stat_statements tunables — track every statement (incl. ones
            # nested inside functions) and cap distinct-statement memory at 10k
            # entries (default 5k). The exporter reads from this view; see
            # spec §6.1 for why this is wired in alongside pg_tracing.
            - -c
            - pg_stat_statements.track=all
            - -c
            - pg_stat_statements.max=10000
            # 1.0 = trace every statement. Fine for the demo; production tuning
            # would drop this to ~0.01–0.05 to keep WAL/CPU overhead low.
            - -c
            - pg_tracing.sample_rate=1.0
            - -c
            - pg_tracing.otel_endpoint=http://otel-collector:4318/v1/traces
            - -c
            - pg_tracing.otel_naptime=2000
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./service_catalog/postgres16/initdb:/docker-entrypoint-initdb.d:ro
            - ./service_catalog/postgres16/postgresql.conf:/etc/postgresql/postgresql.conf:ro
            - ./service_catalog/postgres16/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
        secrets:
            - source: postgres_id_crt
              target: /run/postgres/id.crt
              mode: 0444
            - source: postgres_id_key
              target: /run/postgres/id.key
              mode: 0444
            - source: postgres_trust_ca
              target: /run/postgres/trust.ca.crt
              mode: 0444
        healthcheck:
            # Local unix-socket connection as `postgres` (no SSL needed). Verifies
            # the database is up; cert auth is exercised by the actual mTLS
            # connections from server + postgres-exporter.
            test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
            interval: 10s
            timeout: 3s
            retries: 5
        labels:
            # Mesh-exempt: postgres uses native pg STARTTLS (sslmode=verify-full),
            # not a generic L4/L7 mTLS terminator. The mesh sidecar would re-wrap
            # an already-TLS connection. See chart/Plan notes.
            mesh.exempt: "true"
            metrics.service_name: postgres
            metrics.module_name: postgres16
            metrics.owned_by: sre@example.com
    # Postgres infra + pg_stat_statements metrics. Scraped by the per-module
    # sidecar collector (Task 3.3) which pushes OTLP to the main otel-collector.
    # The community exporter's built-in queries cover pg_stat_*, including
    # pg_stat_statements once the extension exists (initdb/02-pg_stat_statements.sql).
    postgres-exporter:
        image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
        container_name: postgres-exporter
        # Same dance as postgres: the Go `pq` driver enforces strict perms on
        # .key (must be 0600 / 0640). Copy bind-mounted certs into /tmp/pgx-
        # ssl/ with the right mode, then drop privileges and run the original
        # entrypoint. The image's stock entrypoint is the exporter binary.
        user: "0:0"
        entrypoint:
            - sh
            - -c
            - |
              set -e
              mkdir -p /tmp/pgx-ssl
              cp /run/postgres-exporter/id.crt  /tmp/pgx-ssl/id.crt
              cp /run/postgres-exporter/id.key  /tmp/pgx-ssl/id.key
              cp /run/postgres-exporter/trust.ca.crt /tmp/pgx-ssl/trust.ca.crt
              chmod 0600 /tmp/pgx-ssl/id.key
              chown -R nobody:nobody /tmp/pgx-ssl
              exec su -s /bin/sh nobody -c '/bin/postgres_exporter "$$@"' -- "$@"
            - --
        command:
            - --extend.query-path=/etc/postgres-exporter/queries.yaml
        environment:
            # LocalMesh mTLS: postgres-exporter presents its own LocalMesh cert
            # (CN=postgres-exporter) and connects as the cert-bound role of the
            # same name. Role was provisioned by initdb/00-roles.sql.
            DATA_SOURCE_NAME: "postgresql://postgres-exporter@postgres:5432/app?sslmode=verify-full&sslrootcert=/tmp/pgx-ssl/trust.ca.crt&sslcert=/tmp/pgx-ssl/id.crt&sslkey=/tmp/pgx-ssl/id.key"
        secrets:
            - source: postgres-exporter_id_crt
              target: /run/postgres-exporter/id.crt
              mode: 0444
            - source: postgres-exporter_id_key
              target: /run/postgres-exporter/id.key
              mode: 0440
            - source: postgres-exporter_trust_ca
              target: /run/postgres-exporter/trust.ca.crt
              mode: 0444
        configs:
            - source: database_pgexporter_queries
              target: /etc/postgres-exporter/queries.yaml
        depends_on:
            postgres:
                condition: service_healthy
        labels:
            # depends_on target → katenary needs a port for the init-container probe
            katenary.v3/ports: |-
                - 9187
            # Mesh-exempt: postgres-exporter dials postgres with native pg mTLS
            # (sslmode=verify-full); same reasoning as postgres above. The sidecar
            # would have nothing useful to do.
            mesh.exempt: "true"
            # Project-wide convention: cadvisor metric_relabel_configs stamps this
            # value as the `service` label on container resource metrics, so the
            # exporter's cpu/mem/etc. roll up under the same `service=postgres` lens
            # cluster-health uses. Not the same channel as module_name/owned_by on
            # the scraped series (that's Task 3.3, the sidecar collector).
            metrics.service_name: postgres
            metrics.module_name: postgres16
            metrics.owned_by: sre@example.com
    tempo:
        image: grafana/tempo:2.10.5
        container_name: tempo
        command: ["-config.file=/etc/tempo/tempo.yaml"]
        configs:
            - source: tempo_config
              target: /etc/tempo/tempo.yaml
        volumes:
            - tempo-data:/var/tempo
        labels:
            mesh.exempt: "true"
            metrics.service_name: observability
            metrics.module_name: observability
            metrics.owned_by: sre@example.com
        # Internal-only; Grafana proxies it. No healthcheck — Tempo's image
        # is minimal; rely on service_started for ordering.
    vector:
        image: timberio/vector:0.46.0-debian
        container_name: vector
        configs:
            - source: vector_config
              target: /etc/vector/vector.yaml
        # Reading the docker socket needs either root or membership in the
        # host `docker` group. Same trade-off the otel-collector made for
        # /var/lib/docker access; mount is read-only.
        user: "0:0"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        labels:
            mesh.exempt: "true"
            metrics.service_name: logging
            metrics.module_name: logging
            metrics.owned_by: sre@example.com
        depends_on:
            loki:
                condition: service_started
    victoriametrics:
        image: victoriametrics/victoria-metrics:v1.106.0
        container_name: victoriametrics
        command:
            - '--storageDataPath=/victoria-metrics-data'
            - '--httpListenAddr=:8428'
            # Translate OTLP-ingested metric names to Prom convention
            # (dots → underscores, _bucket/_sum/_count suffixes for histograms).
            # The imported APM dashboard queries by Prom-shaped names.
            - '--opentelemetry.usePrometheusNaming'
        ports:
            - "8428:8428"
        volumes:
            - vm-data:/victoria-metrics-data
        labels:
            mesh.exempt: "true"
            metrics.service_name: observability
            metrics.module_name: observability
            metrics.owned_by: sre@example.com
        # No healthcheck: VM image is FROM scratch — no wget/curl/shell.
        # Reviewer-debug: `curl http://localhost:8428/health` from host.
configs:
    otel_collector_config:
        content: |
            extensions:
              health_check:
                endpoint: 0.0.0.0:13133
            receivers:
              otlp:
                protocols:
                  grpc:
                    endpoint: 0.0.0.0:4317
                  http:
                    endpoint: 0.0.0.0:4318
              prometheus:
                config:
                  scrape_configs:
                    # Single docker_sd discovery job covering all Pattern-A
                    # scrape targets. Emitter containers opt in via
                    # prometheus.io/scrape=true; port and path come from labels.
                    # Pattern B sidecar collectors (e.g. database-collector
                    # pushing OTLP) are unaffected.
                    # TODO: needs_prod_decisions kubernetes_sd_configs replaces docker_sd_configs in prod
                    # TODO: needs_prod_decisions localmesh CLI emits prometheus.io/* labels from plugin.toml [[exports.metrics]]
                    - job_name: discovered
                      docker_sd_configs:
                        - host: unix:///var/run/docker.sock
                          refresh_interval: 30s
                      relabel_configs:
                        # Keep only containers explicitly opting in
                        - source_labels: [__meta_docker_container_label_prometheus_io_scrape]
                          regex: "true"
                          action: keep
                        # Strip the leading slash from Docker's container-name label
                        - source_labels: [__meta_docker_container_name]
                          target_label: __tmp_name
                          regex: "/(.+)"
                          replacement: "$1"
                        # target = <container-name>:<port-from-label>. The
                        # two source labels join via `separator: ":"` and the
                        # default `regex: (.+)` + `replacement: $1` writes the
                        # whole joined string to __address__.
                        - source_labels: [__tmp_name, __meta_docker_container_label_prometheus_io_port]
                          target_label: __address__
                          separator: ":"
                        # Custom metrics path, default /metrics if label absent
                        - source_labels: [__meta_docker_container_label_prometheus_io_path]
                          target_label: __metrics_path__
                          regex: (.+)
                        # Propagate the catalog's identity tuple from container
                        # labels. We write `job` (not `service_name`) because the
                        # OTel prometheus receiver translates Prom `job` →
                        # OTLP `service.name`, which becomes the `service_name`
                        # series label after resource_to_telemetry_conversion.
                        # That's the same path the old static jobs took
                        # (`job_name: <svc>` → `service_name=<svc>`); Pattern B's
                        # OTLP-pushed metrics carry `service_name` via the same
                        # resource attr — the two paths converge.
                        - source_labels: [__meta_docker_container_label_metrics_service_name]
                          target_label: job
                        - source_labels: [__meta_docker_container_label_metrics_module_name]
                          target_label: module_name
                        - source_labels: [__meta_docker_container_label_metrics_owned_by]
                          target_label: owned_by
                      metric_relabel_configs:
                        # Three rules scoped to cadvisor's per-container series.
                        # Other targets' metrics no-op because the source labels
                        # are absent.
                        #
                        # Rule 1 — project filter. Drops samples from containers
                        # outside this compose project (e.g. agentbox-* on the
                        # host daemon). The `|` empty alternative lets
                        # non-cadvisor series through (they don't carry
                        # container_label_com_docker_compose_project).
                        # See docs/TODO.md "My thoughts" for the planned revisit.
                        - source_labels: [container_label_com_docker_compose_project]
                          regex: '${PROJECT_NAME}|'
                          action: keep
                        # Rule 2 — copy cadvisor's observed-container metrics
                        # label into `service`. Step 1 of the two-step fallback.
                        - source_labels: [container_label_metrics_service_name]
                          target_label: service
                        # Rule 3 — fallback to container name when rule 2
                        # produced an empty `service`. Two-step pattern: rule 2
                        # copies the metrics label if present; rule 3's regex
                        # `;(.+)` matches the joined `service;name` string only
                        # when service is empty, capturing `name` as the
                        # replacement.
                        #
                        # Scope caveat: rules 2 and 3 run on every discovered
                        # target's metrics, not just cadvisor's. They no-op on
                        # non-cadvisor series because container_label_* source
                        # labels are absent. If a future non-cadvisor target
                        # ever exposes a `name` label, rule 3 would overwrite
                        # its `service` — keep that in mind when adding
                        # emitters.
                        - source_labels: [service, name]
                          separator: ';'
                          regex: ';(.+)'
                          target_label: service
                          replacement: '$1'
            processors:
              # Stamps `project_name=${PROJECT_NAME}` on every span and log.
              # The value comes from .env's PROJECT_NAME, which mirrors
              # project.toml's identity block; once the platform reads
              # project.toml directly, this becomes a pure passthrough.
              resource/project:
                attributes:
                  - key: project_name
                    value: ${PROJECT_NAME}
                    action: upsert
              # pg_tracing hard-codes service.name=PostgreSQL_Server and ignores
              # OTEL_RESOURCE_ATTRIBUTES, so the database module's resource attrs
              # land here at the collector instead of at the source. Rename to
              # `postgres` for dashboard cleanliness; stamp `module_name`/`owned_by`
              # to match the rest of the catalogue contract.
              transform/database:
                trace_statements:
                  - context: resource
                    statements:
                      - set(attributes["module_name"], "database") where attributes["service.name"] == "PostgreSQL_Server"
                      - set(attributes["owned_by"], "sre@example.com") where attributes["service.name"] == "PostgreSQL_Server"
                      - set(attributes["service.name"], "postgres") where attributes["service.name"] == "PostgreSQL_Server"
            exporters:
              # Apps push OTLP metrics to the collector; the collector translates
              # to Prom remote-write on VM's behalf. The translation IS the
              # OTel→Prom spec: target_info series per unique resource + resource
              # attrs landed as data-point labels (via resource_to_telemetry_conversion).
              # VM has an OTLP receiver, but as of 1.106 it skips target_info
              # synthesis, which the imported APM dashboard's header stat panels need.
              prometheusremotewrite:
                endpoint: http://victoriametrics:8428/api/v1/write
                resource_to_telemetry_conversion:
                  enabled: true
              debug:
                verbosity: detailed
              otlp/tempo:
                endpoint: tempo:4317
                tls:
                  insecure: true
            service:
              extensions: [health_check]
              pipelines:
                metrics:
                  receivers: [otlp, prometheus]
                  processors: [resource/project]
                  exporters: [prometheusremotewrite]
                traces:
                  receivers: [otlp]
                  processors: [transform/database, resource/project]
                  exporters: [otlp/tempo, debug]
    grafana_vm_datasource:
        content: |
            apiVersion: 1
            datasources:
              - name: VictoriaMetrics
                uid: vm
                type: prometheus
                access: proxy
                url: http://victoriametrics:8428
                isDefault: true
                editable: false
    grafana_tempo_datasource:
        content: |
            apiVersion: 1
            datasources:
              - name: Tempo
                uid: tempo
                type: tempo
                access: proxy
                url: http://tempo:3200
                editable: false
                jsonData:
                  serviceMap:
                    datasourceUid: vm
    grafana_loki_datasource:
        content: |
            apiVersion: 1
            datasources:
              - name: Loki
                uid: loki
                type: loki
                access: proxy
                url: http://loki:3100
                editable: false
                jsonData:
                  # Click through from a trace span to its container's logs.
                  derivedFields:
                    - name: TraceID
                      matcherRegex: '"trace_id":"(\w+)"'
                      url: '$${__value.raw}'
                      datasourceUid: tempo
    tempo_config:
        content: |
            server:
              http_listen_port: 3200
            distributor:
              receivers:
                otlp:
                  protocols:
                    grpc:
                      endpoint: 0.0.0.0:4317
            storage:
              trace:
                backend: local
                local:
                  path: /var/tempo/blocks
                wal:
                  path: /var/tempo/wal
            metrics_generator:
              registry:
                external_labels:
                  source: tempo
              storage:
                path: /var/tempo/generator/wal
                remote_write:
                  - url: http://victoriametrics:8428/api/v1/write
                    send_exemplars: true
              processor:
                service_graphs: {}
                # span_metrics emits traces_spanmetrics_{calls_total,latency_*} —
                # the RED side of the per-service dashboards. Default dimensions are
                # service / span_name / span_kind / status_code; `dimensions:` adds
                # the catalogue's resource attrs so dashboards can slice by module.
                span_metrics:
                  dimensions:
                    - module_name
                    - owned_by
            overrides:
              defaults:
                metrics_generator:
                  processors: [service-graphs, span-metrics]
    grafana_dashboards_provider:
        content: |
            apiVersion: 1
            providers:
              - name: default
                type: file
                # Read-only stance deferred — spec §4.3. Flip to false once the
                # module-shipped-dashboard pattern is stable.
                allowUiUpdates: true
                options:
                  path: /etc/grafana/dashboards
                  # Subdir under path: becomes the UI folder name. The catalogue
                  # mounts each module's dashboards under .../<module>/<slug>.json
                  # so each module gets its own folder.
                  foldersFromFilesStructure: true
    # Bookmark-worthy production-ops dashboards. Each is a JSON file under
    # ./ (alongside this compose file) — externalised because inlining gets
    # unwieldy past a couple of panels. The file provider configured above
    # picks up everything that lands in /etc/grafana/dashboards/.
    #
    # Roster (intentionally a small set, not a comprehensive library — ops
    # ships the starter shapes, teams fork into their own):
    #
    #   apm              Imported Lightweight APM for OpenTelemetry (dashboard 22784).
    #                    Application-services lens: RED + inbound/outbound + logs + traces.
    #   cluster-health   Module roster + container roster + USE (cpu/mem/net + throttle).
    observability_dashboard_apm:
        file: ./service_catalog/observability/apm.json
    observability_dashboard_cluster_health:
        file: ./service_catalog/observability/cluster-health.json
    loki_config:
        content: |
            # Single-instance, in-memory ring, filesystem storage. Fine for the
            # dev catalogue; prod overlay swaps storage_config to S3/GCS and
            # enables auth + multi-tenancy.
            auth_enabled: false
            server:
              http_listen_port: 3100
            common:
              instance_addr: 127.0.0.1
              path_prefix: /loki
              storage:
                filesystem:
                  chunks_directory: /loki/chunks
                  rules_directory: /loki/rules
              replication_factor: 1
              ring:
                kvstore:
                  store: inmemory
            schema_config:
              configs:
                - from: 2024-04-01
                  store: tsdb
                  object_store: filesystem
                  schema: v13
                  index:
                    prefix: index_
                    period: 24h
            # Default limits suit single-tenant local dev. Bump if the demo
            # generates more than ~4MB/s of logs.
            limits_config:
              allow_structured_metadata: true
            # By default Loki only promotes service.name from OTLP attributes to
            # an indexed label. Container scrapes don't have a service.name, so
            # query selectivity collapses to {service_name="unknown_service"}
            # without this. Container id has bounded cardinality (host-local).
            distributor:
              otlp_config:
                default_resource_attributes_as_index_labels:
                  - container_id
                  - module_name
                  - owned_by
                  - service                            # legacy JSON-stdout contract
                  - service.name                       # OTel-canonical; APM dashboard queries by service_name
                  - service.namespace
                  - service.instance.id
                  - deployment.environment.name
                  - level
                  # trace_id / span_id intentionally not indexed —
                  # structured-metadata only (see observability filelog operators).
    # Vector log pipeline — runs in parallel with the otel-collector's filelog
    # receiver during chunks 3-4 (transient duplication); chunk 5 removes the
    # collector path so Vector is the sole log source. Spec §4.1.
    #
    # `.label."metrics.service_name"` field references are based on Vector's
    # documented docker_logs schema. If a fresh release flips the plural,
    # find/replace to `.labels.*` — flagged in spec §4.1.
    vector_config:
        content: |
            sources:
              docker:
                type: docker_logs
                docker_host: unix:///var/run/docker.sock
                # Restrict to containers in this compose project. The host may
                # also be running other containers we don't own.
                include_labels:
                  - "com.docker.compose.project=${PROJECT_NAME}"

            transforms:
              # Agent-side identity enrichment — apps emit the envelope, the agent
              # supplies the resource attrs from container labels. Rules doc §3.
              enrich:
                type: remap
                inputs: ["docker"]
                source: |
                  .service_name   = .label."metrics.service_name"
                  .module_name    = .label."metrics.module_name"
                  .owned_by       = .label."metrics.owned_by"
                  .container_id   = .container_id
                  .deployment_environment_name = "dev"
                  del(.label)

              # Parse the app envelope out of `.message` (which is a JSON string for
              # conformant emitters; everything else just falls through unchanged).
              # parse_json! errors are caught and the event is left alone so non-app
              # sources (postgres native, grafana logfmt, etc.) can be normalised
              # downstream by the per-source remaps.
              parse_envelope:
                type: remap
                inputs: ["enrich"]
                source: |
                  parsed, err = parse_json(.message)
                  if err == null {
                    # merge (no !) is infallible — VRL's bang variant is for
                    # fallible operations only.
                    . = merge(., object!(parsed))
                  }

              # Per-source routing. Two real per-source remaps (postgres, grafana —
              # the non-app sources whose severity matters to dashboards); everything
              # else falls through to normalise._unmatched and norm_default.
              # Spec §4.3.
              normalise:
                type: route
                inputs: ["parse_envelope"]
                route:
                  postgres:        '.service_name == "postgres"'
                  grafana:         '.service_name == "observability" && .container_name == "grafana"'

              # Postgres 15+ with log_destination=jsonlog emits {timestamp,
              # error_severity, message, ...}. Map error_severity enum into the
              # contract's lowercase level enum. Guard against missing field —
              # VRL `||` short-circuits on null/error, but `.error_severity` may be
              # absent, so `exists()` is the safe form.
              norm_postgres:
                type: remap
                inputs: ["normalise.postgres"]
                source: |
                  sev = if exists(.error_severity) { downcase(string!(.error_severity)) } else { "info" }
                  .level = if sev == "warning" { "warn"
                    } else if sev == "panic"   { "fatal"
                    } else if sev == "notice"  { "info"
                    } else                     { sev }
                  del(.error_severity)

              # Grafana emits logfmt by default. lvl ∈ {dbug, info, warn, eror, crit}.
              norm_grafana:
                type: remap
                inputs: ["normalise.grafana"]
                source: |
                  parsed = parse_logfmt!(.message)
                  .timestamp = parsed.t
                  .level     = if parsed.lvl == "eror" { "error"
                               } else if parsed.lvl == "dbug" { "debug"
                               } else if parsed.lvl == "crit" { "fatal"
                               } else                          { parsed.lvl }
                  .message   = parsed.msg

              # Catch-all for everything not explicitly routed. App events (server,
              # www) fall here too — they already have .level set by parse_envelope,
              # so the `if !exists` guard makes this a no-op for them. Infra sources
              # we haven't written a per-source remap for get a level=info default
              # so they're searchable but not severity-filtered (spec §4.3).
              norm_default:
                type: remap
                inputs: ["normalise._unmatched"]
                source: |
                  if !exists(.level) { .level = "info" }

              # Severity-enum validator. Lowercase + bound to the 6-value contract
              # enum; drop the field (rather than coerce) for malformed values, so
              # a typo at the source can't grow the Loki label set forever. Spec §4.2.
              # Inputs are ONLY the per-source normalisers — parse_envelope events
              # all flow through the route to one of them; reading parse_envelope
              # directly here would duplicate every event.
              validate:
                type: remap
                inputs: ["norm_postgres", "norm_grafana", "norm_default"]
                source: |
                  .level = if exists(.level) { downcase(string!(.level)) } else { null }
                  allowed = ["trace", "debug", "info", "warn", "error", "fatal"]
                  if .level != null && !includes(allowed, .level) { del(.level) }
                  # Loki sink's structured_metadata block reads {{ trace_id }} /
                  # {{ span_id }} and fails to render the entire event if the
                  # field is missing. Default to empty string so non-span events
                  # (most infra logs) still ship cleanly. Empty structured
                  # metadata is accepted by Loki.
                  if !exists(.trace_id)          { .trace_id          = "" }
                  if !exists(.span_id)           { .span_id           = "" }
                  if !exists(.mtls_peer_subject) { .mtls_peer_subject = "" }
                  if !exists(.mtls_tls_version)  { .mtls_tls_version  = "" }
                  if !exists(.http_method)       { .http_method       = "" }
                  if !exists(.http_path)         { .http_path         = "" }
                  if !exists(.http_status)       { .http_status       = "" }
                  if !exists(.duration_ms)       { .duration_ms       = "" }

            sinks:
              loki:
                type: loki
                inputs: ["validate"]
                endpoint: http://loki:3100
                encoding:
                  codec: json
                # Cardinality contract: rules doc §2. Labels = bounded indexed
                # dimensions; structured_metadata = high-cardinality queryable;
                # body = the full JSON event (encoding.codec=json).
                labels:
                  service_name: "{{ service_name }}"
                  module_name:  "{{ module_name }}"
                  owned_by:     "{{ owned_by }}"
                  deployment_environment_name: "{{ deployment_environment_name }}"
                  level:        "{{ level }}"
                  container_id: "{{ container_id }}"
                # trace_id / span_id from parse_envelope — addressable in LogQL
                # via `| trace_id="…"` without being indexed (spec AC 5).
                # mTLS / HTTP structured fields: envoy emits them in its JSON access
                # logs, but the access-log shape is not yet wired through Vector.
                # Empty defaults survive Loki.
                # TODO: needs_prod_decisions wire envoy access logs to structured_metadata
                structured_metadata:
                  trace_id: "{{ trace_id }}"
                  span_id:  "{{ span_id }}"
                  mtls_peer_subject: "{{ mtls_peer_subject }}"
                  mtls_tls_version:  "{{ mtls_tls_version }}"
                  http_method:       "{{ http_method }}"
                  http_path:         "{{ http_path }}"
                  http_status:       "{{ http_status }}"
                  duration_ms:       "{{ duration_ms }}"
    # Self-contained metrics emission for the database module. The sidecar
    # collector scrapes postgres-exporter and pushes OTLP to the main
    # collector at otel-collector:4317. Spec §6.3 fallback — chosen because
    # otel-collector-contrib:0.152.0 doesn't ship the `glob:` config provider
    # that the multi-config-merge alternative would have needed.
    database_pgexporter_queries:
        file: ./service_catalog/postgres16/postgres-exporter-queries.yaml
    database_dashboard_postgres:
        file: ./service_catalog/postgres16/postgres.json
    database_collector_config:
        content: |
            receivers:
              prometheus:
                config:
                  scrape_configs:
                    - job_name: postgres-exporter
                      static_configs:
                        - targets: ['postgres-exporter:9187']
                      scrape_interval: 30s
            processors:
              # Stamps the same identity tuple the rest of the catalogue uses.
              # `service.name=postgres` overrides postgres-exporter's default
              # (which would be the exporter's own name).
              resource:
                attributes:
                  - key: service.name
                    value: postgres
                    action: upsert
                  - key: module_name
                    value: postgres16
                    action: upsert
                  - key: owned_by
                    value: sre@example.com
                    action: upsert
            exporters:
              otlp:
                endpoint: otel-collector:4317
                tls:
                  insecure: true
            service:
              pipelines:
                metrics:
                  receivers: [prometheus]
                  processors: [resource]
                  exporters: [otlp]
volumes:
    vm-data: {}
    grafana-data: {}
    tempo-data: {}
    loki-data: {}
    postgres-data: {}
secrets:
    postgres_id_crt:
        file: ./secrets/postgres/id.crt
    postgres_id_key:
        file: ./secrets/postgres/id.key
    postgres_trust_ca:
        file: ./secrets/postgres/trust.ca.crt
    postgres-exporter_id_crt:
        file: ./secrets/postgres-exporter/id.crt
    postgres-exporter_id_key:
        file: ./secrets/postgres-exporter/id.key
    postgres-exporter_trust_ca:
        file: ./secrets/postgres-exporter/trust.ca.crt
