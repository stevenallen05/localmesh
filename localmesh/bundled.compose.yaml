# Auto-generated by ./localmesh_src/cmd/localmesh build — do not edit by hand.
# observability/docker-compose.yml.gotmpl
#
# Six containers: collector (alloy) + databases (tempo, loki, prometheus) +
# UI (grafana) + container-metrics source (cadvisor). All six are exempted
# from alloy's own log + scrape discovery via the
# com.localmesh.observability.exempt label.
#
# The trailing `range .Project.Services` block injects OTel env vars onto
# every user service declared in project.toml. Docker Compose's `include`
# merges this with the top-level service definition at runtime.

services:
    # ──── alloy: single collection agent ────────────────────────────────
    # No healthcheck: alloy ships as a distroless image with no probe binary.
    # Alloy is the leaf of the observability stack — nothing depends_on it,
    # so the lack of a health signal has no downstream effect.
    alloy:
        image: grafana/alloy:v1.5.1
        container_name: alloy
        command:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --stability.level=experimental
            - /etc/alloy/config.alloy
        ports:
            - "14317:4317"
            - "14318:4318"
            - "12345:12345" # 5-digit; "1"-prefix would overflow 65535
        volumes:
            - ./service_catalog/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /:/rootfs:ro,rslave
            - /proc:/host/proc:ro,rslave
            - /sys:/host/sys:ro,rslave
        privileged: true
        pid: host
        restart: unless-stopped
        depends_on:
            tempo:
                condition: service_started # distroless image; no probe binary
            loki:
                condition: service_healthy
            prometheus:
                condition: service_healthy
        labels:
            com.localmesh.observability.exempt: "true"
            metrics.service_name: alloy
            metrics.module_name: observability
            metrics.owned_by: sre@example.com
    # ──── cadvisor: container metrics source ────────────────────────────
    cadvisor:
        image: gcr.io/cadvisor/cadvisor:v0.52.1
        container_name: cadvisor
        privileged: true
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
            - /dev/disk/:/dev/disk:ro
        devices:
            - /dev/kmsg
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
            interval: 10s
            timeout: 3s
            retries: 5
        labels:
            com.localmesh.observability.exempt: "true"
            metrics.service_name: cadvisor
            metrics.module_name: observability
            metrics.owned_by: sre@example.com
    # ──── grafana: dashboards + explore ─────────────────────────────────
    grafana:
        image: grafana/grafana:12.4.3
        container_name: grafana
        ports:
            - "13000:3000"
        environment:
            GF_AUTH_ANONYMOUS_ENABLED: "true"
            GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
        volumes:
            - ./service_catalog/observability/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./service_catalog/observability/grafana/dashboards:/etc/grafana/dashboards:ro
        tmpfs:
            - /var/lib/grafana:mode=0777
        restart: unless-stopped
        depends_on:
            tempo:
                condition: service_started # distroless image; no probe binary
            loki:
                condition: service_healthy
            prometheus:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
            interval: 10s
            timeout: 3s
            retries: 5
        labels:
            com.localmesh.observability.exempt: "true"
            metrics.service_name: grafana
            metrics.module_name: observability
            metrics.owned_by: sre@example.com
    grafana-mesh:
        build:
            context: ./service_catalog/mesh
            dockerfile: Dockerfile.dataplane
        image: localmesh-dataplane:dev
        network_mode: "service:grafana"
        cap_add:
            - NET_ADMIN
            - NET_RAW
        configs:
            - source: transparent_proxy
              target: /etc/kuma/transparent-proxy.yaml
        environment:
            WORKLOAD_NAME: grafana
            APP_PORT: "3000"
            APP_PROTOCOL: "http"
            CP_HOST: kuma-cp:5678
        depends_on:
            grafana:
                condition: service_started
            kuma-cp:
                condition: service_started
            localmesh-dataplane-bootstrap:
                condition: service_completed_successfully
        restart: unless-stopped
    ingress:
        build:
            context: ./service_catalog/mesh
            dockerfile: Dockerfile.dataplane
        image: localmesh-dataplane:dev
        # BUILTIN gateway dataplane. Gateways don't transparent-proxy, so no
        # NET_ADMIN; kuma fills the dataplane address var via --dataplane-var.
        # entrypoint:[] overrides the image's dataplane-init.sh ENTRYPOINT so
        # the command below runs kuma-dp directly (no workload init).
        # `$$` is Compose's variable-escape (renders to `$` at runtime); `\$$1`
        # reaches awk as `$1`.
        entrypoint: []
        command:
            - /bin/bash
            - -c
            - 'APP_ADDR=$$(hostname -i | awk "{print \$$1}"); exec /usr/local/bin/kuma-dp run --cp-address=https://kuma-cp:5678 --dataplane-file=/etc/kuma/ingress.yaml --dataplane-var=address=$$APP_ADDR'
        configs:
            - source: ingress_dataplane
              target: /etc/kuma/ingress.yaml
        ports:
            - "8443:8443"
        depends_on:
            kuma-cp:
                condition: service_started
            localmesh-dataplane-bootstrap:
                condition: service_completed_successfully
        restart: unless-stopped
    kuma-cp:
        image: docker.io/kumahq/kuma-cp:2.13.6
        # kuma-cp's auto-generated TLS cert SANs are derived from the container
        # hostname; dataplanes dial https://kuma-cp:5678 and reject the cert
        # without a matching SAN.
        hostname: kuma-cp
        command: ["run"]
        environment:
            KUMA_MODE: standalone
            KUMA_ENVIRONMENT: universal
            KUMA_STORE_TYPE: memory
            KUMA_API_SERVER_HTTP_INTERFACE: 0.0.0.0
            KUMA_API_SERVER_HTTP_PORT: "5681"
            KUMA_DP_SERVER_PORT: "5678"
            KUMA_DP_SERVER_AUTHN_DP_PROXY_TYPE: none
            # Dev-only: allow unauthenticated callers to manage admin resources
            # (Secrets, MeshGateway) so the bootstrap container needs no token.
            KUMA_ACCESS_STATIC_ADMIN_RESOURCES_GROUPS: "mesh-system:admin,mesh-system:unauthenticated"
        expose:
            - "5678"
        ports:
            - "25681:5681"
    localmesh-dataplane-bootstrap:
        build:
            context: ./service_catalog/mesh
            dockerfile: Dockerfile.dataplane
        image: localmesh-dataplane:dev
        entrypoint: ["/bin/bash", "/usr/local/bin/bootstrap.sh"]
        depends_on:
            kuma-cp:
                condition: service_started
        configs:
            - source: mesh_defaults
              target: /etc/localmesh/bootstrap/00-mesh-and-identity.yaml
            - source: ingress_tls_secret
              target: /etc/localmesh/bootstrap/05-ingress-tls.yaml
            - source: allow_all
              target: /etc/localmesh/bootstrap/10-traffic-permission.yaml
            - source: passthrough_policy
              target: /etc/localmesh/bootstrap/15-passthrough.yaml
            - source: mesh_trace_policy
              target: /etc/localmesh/bootstrap/20-trace.yaml
            - source: ingress_gateway
              target: /etc/localmesh/bootstrap/30-ingress-mesh-gateway.yaml
            - source: ingress_routes
              target: /etc/localmesh/bootstrap/40-ingress-routes.yaml
        restart: "no"
    # ──── loki: log store ───────────────────────────────────────────────
    # TODO: needs_prod_decisions retention + persistent volumes
    loki:
        image: grafana/loki:3.3.0
        container_name: loki
        command: ["-config.file=/etc/loki/loki.yaml"]
        volumes:
            - ./service_catalog/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
        tmpfs:
            - /loki:mode=0777
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
        labels:
            com.localmesh.observability.exempt: "true"
            metrics.service_name: loki
            metrics.module_name: observability
            metrics.owned_by: sre@example.com
    postgres:
        build:
            context: ./service_catalog/postgres16
            dockerfile: Dockerfile
        image: metrics-stack/postgres-pgtracing:0.1.0
        container_name: postgres
        environment:
            POSTGRES_DB: ${POSTGRES16_DATABASE}
            POSTGRES_USER: ${POSTGRES16_USERNAME}
            POSTGRES_PASSWORD: ${POSTGRES16_PASSWORD}
            OTEL_RESOURCE_ATTRIBUTES: "module_name=postgres16,owned_by=sre@example.com"
            OTEL_SERVICE_NAME: postgres
        command:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
            - -c
            - shared_preload_libraries=pg_tracing,pg_stat_statements
            - -c
            - pg_stat_statements.track=all
            - -c
            - pg_stat_statements.max=10000
            - -c
            - pg_tracing.sample_rate=1.0
            - -c
            - pg_tracing.otel_endpoint=http://alloy:4318/v1/traces
            - -c
            - pg_tracing.otel_naptime=2000
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./service_catalog/postgres16/initdb:/docker-entrypoint-initdb.d:ro
            - ./service_catalog/postgres16/postgresql.conf:/etc/postgresql/postgresql.conf:ro
            - ./service_catalog/postgres16/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES16_USERNAME} -d ${POSTGRES16_DATABASE}"]
            interval: 10s
            timeout: 3s
            retries: 5
        labels:
            metrics.service_name: postgres
            metrics.module_name: postgres16
            metrics.owned_by: sre@example.com
    postgres-exporter:
        image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
        container_name: postgres-exporter
        environment:
            DATA_SOURCE_NAME: "postgresql://${POSTGRES16_USERNAME}:${POSTGRES16_PASSWORD}@postgres:5432/${POSTGRES16_DATABASE}?sslmode=disable"
            OTEL_RESOURCE_ATTRIBUTES: "module_name=postgres16,owned_by=sre@example.com"
            OTEL_SERVICE_NAME: postgres-exporter
        depends_on:
            postgres:
                condition: service_healthy
        labels:
            com.localmesh.scrape: "true"
            com.localmesh.scrape.port: "9187"
            metrics.service_name: postgres-exporter
            metrics.module_name: postgres16
            metrics.owned_by: sre@example.com
    postgres-exporter-mesh:
        build:
            context: ./service_catalog/mesh
            dockerfile: Dockerfile.dataplane
        image: localmesh-dataplane:dev
        network_mode: "service:postgres-exporter"
        cap_add:
            - NET_ADMIN
            - NET_RAW
        configs:
            - source: transparent_proxy
              target: /etc/kuma/transparent-proxy.yaml
        environment:
            WORKLOAD_NAME: postgres-exporter
            APP_PORT: "9187"
            APP_PROTOCOL: "http"
            CP_HOST: kuma-cp:5678
        depends_on:
            postgres-exporter:
                condition: service_started
            kuma-cp:
                condition: service_started
            localmesh-dataplane-bootstrap:
                condition: service_completed_successfully
        restart: unless-stopped
    postgres-mesh:
        build:
            context: ./service_catalog/mesh
            dockerfile: Dockerfile.dataplane
        image: localmesh-dataplane:dev
        network_mode: "service:postgres"
        cap_add:
            - NET_ADMIN
            - NET_RAW
        configs:
            - source: transparent_proxy
              target: /etc/kuma/transparent-proxy.yaml
        environment:
            WORKLOAD_NAME: postgres
            APP_PORT: "5432"
            APP_PROTOCOL: "tcp"
            CP_HOST: kuma-cp:5678
        depends_on:
            postgres:
                condition: service_started
            kuma-cp:
                condition: service_started
            localmesh-dataplane-bootstrap:
                condition: service_completed_successfully
        restart: unless-stopped
    # ──── prometheus: metrics store (Mimir stand-in for local dev) ──────
    # TODO: needs_prod_decisions retention + persistent volumes
    prometheus:
        image: prom/prometheus:v3.0.0
        container_name: prometheus
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-remote-write-receiver
            - --enable-feature=exemplar-storage
            - --web.listen-address=:9090
        ports:
            - "19090:9090"
        volumes:
            - ./service_catalog/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        tmpfs:
            - /prometheus:mode=0777
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
            interval: 10s
            timeout: 3s
            retries: 5
        labels:
            com.localmesh.observability.exempt: "true"
            metrics.service_name: prometheus
            metrics.module_name: observability
            metrics.owned_by: sre@example.com
    redis:
        image: redis:7-alpine
        container_name: redis
        command:
            - redis-server
            - --maxmemory
            - ${REDIS_MAXMEMORY}
            - --maxmemory-policy
            - allkeys-lru
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5
        labels:
            metrics.service_name: redis
            metrics.module_name: redis
            metrics.owned_by: sre@example.com
    redis-mesh:
        build:
            context: ./service_catalog/mesh
            dockerfile: Dockerfile.dataplane
        image: localmesh-dataplane:dev
        network_mode: "service:redis"
        cap_add:
            - NET_ADMIN
            - NET_RAW
        configs:
            - source: transparent_proxy
              target: /etc/kuma/transparent-proxy.yaml
        environment:
            WORKLOAD_NAME: redis
            APP_PORT: "6379"
            APP_PROTOCOL: "tcp"
            CP_HOST: kuma-cp:5678
        depends_on:
            redis:
                condition: service_started
            kuma-cp:
                condition: service_started
            localmesh-dataplane-bootstrap:
                condition: service_completed_successfully
        restart: unless-stopped
    # ──── tempo: trace store ────────────────────────────────────────────
    # TODO: needs_prod_decisions retention + persistent volumes
    # No healthcheck: tempo ships as a distroless image with no probe binary
    # (wget, curl, sh, even nc are absent). Tempo's process starts in <1s;
    # dependents wait on service_started only and retry their own connections.
    tempo:
        image: grafana/tempo:2.10.0
        container_name: tempo
        command: ["-config.file=/etc/tempo/tempo.yaml"]
        volumes:
            - ./service_catalog/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
        tmpfs:
            - /var/tempo:mode=0777
        restart: unless-stopped
        labels:
            com.localmesh.observability.exempt: "true"
            metrics.service_name: tempo
            metrics.module_name: observability
            metrics.owned_by: sre@example.com
    # ──── OTel env injection for project services ───────────────────────
    # One stub per [[services]] entry in project.toml. The user's
    # docker-compose.yml carries the authoritative image / ports / build;
    # docker compose's `include:` merge combines that with the
    # environment block emitted here.
    www:
        environment:
            OTEL_SERVICE_NAME: "www"
            OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4317"
            OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    www-mesh:
        build:
            context: ./service_catalog/mesh
            dockerfile: Dockerfile.dataplane
        image: localmesh-dataplane:dev
        network_mode: "service:www"
        cap_add:
            - NET_ADMIN
            - NET_RAW
        configs:
            - source: transparent_proxy
              target: /etc/kuma/transparent-proxy.yaml
        environment:
            WORKLOAD_NAME: www
            APP_PORT: "3443"
            APP_PROTOCOL: "http"
            CP_HOST: kuma-cp:5678
        depends_on:
            www:
                condition: service_started
            kuma-cp:
                condition: service_started
            localmesh-dataplane-bootstrap:
                condition: service_completed_successfully
        restart: unless-stopped
volumes:
    postgres-data: {}
configs:
    mesh_defaults:
        file: ./service_catalog/mesh/bootstrap/00-mesh-and-identity.yaml
    # Rendered inline (not file:) so the listener `hostname` field can use
    # template substitution. Adopts the same pattern as ingress_routes.
    ingress_gateway:
        content: |
            type: MeshGateway
            mesh: default
            name: ingress
            selectors:
              - match:
                  kuma.io/service: ingress
            conf:
              listeners:
                - port: 8443
                  protocol: HTTPS
                  hostname: '*.metrics-collector.lvh.me'
                  tls:
                    mode: TERMINATE
                    certificates:
                      - secret: ingress-tls
                  tags:
                    port: https-ingress
    ingress_tls_secret:
        file: ./secrets/ingress-tls/secret.yaml
    allow_all:
        file: ./service_catalog/mesh/bootstrap/10-traffic-permission.yaml
    mesh_trace_policy:
        file: ./service_catalog/mesh/bootstrap/20-trace.yaml
    # Rendered inline so the appendMatch domain interpolates from project.toml.
    # type: Domain requires an explicit protocol (tcp is invalid for Domain);
    # the wildcard + port: 443 covers browser-visible egress over HTTPS.
    passthrough_policy:
        content: |
            type: MeshPassthrough
            mesh: default
            name: allow-external-apex
            spec:
              targetRef:
                kind: Mesh
              default:
                passthroughMode: Matched
                appendMatch:
                  - type: Domain
                    value: "*.metrics.example.com"
                    protocol: tls
                    port: 443
    ingress_dataplane:
        file: ./service_catalog/mesh/dataplane/ingress.yaml
    transparent_proxy:
        content: |
            kumaDPUser: kuma-data-plane-proxy
            redirect:
              dns:
                enabled: true
            verbose: true
    # Rendered inline (not file:) so per-service routes use the template context.
    # Block-scalar body: indentation is content; `---` separates each route doc.
    ingress_routes:
        content: |
            ---
            type: MeshHTTPRoute
            mesh: default
            name: ingress-route-grafana
            spec:
              targetRef:
                kind: MeshGateway
                name: ingress
                tags:
                  port: https-ingress
              to:
                - targetRef:
                    kind: Mesh
                  hostnames:
                    - grafana.metrics-collector.lvh.me
                  rules:
                    - matches:
                        - path:
                            type: PathPrefix
                            value: "/"
                      default:
                        backendRefs:
                          - kind: MeshService
                            name: grafana
                            port: 3000
            ---
            type: MeshHTTPRoute
            mesh: default
            name: ingress-route-www
            spec:
              targetRef:
                kind: MeshGateway
                name: ingress
                tags:
                  port: https-ingress
              to:
                - targetRef:
                    kind: Mesh
                  hostnames:
                    - www.metrics-collector.lvh.me
                  rules:
                    - matches:
                        - path:
                            type: PathPrefix
                            value: "/"
                      default:
                        backendRefs:
                          - kind: MeshService
                            name: www
                            port: 3443
