[identity]
module_name = "postgres16"
owned_by    = "sre@example.com"

[[services]]
container          = "postgres"
port               = 5432
scheme             = "postgresql" # declared for validation; postgres is needs_mtls_sidecar=false (native pg mTLS)
expose_via_ingress = false        # east-west only
needs_mtls_sidecar = false

[[services]]
container          = "postgres-exporter"
port               = 9187
scheme             = "http"
expose_via_ingress = false        # scraped internally; never via ingress
needs_mtls_sidecar = false