# LocalMesh pg_hba — replaces the postgres image default's `host all all
# 0.0.0.0/0 scram-sha-256` line with verify-full cert auth.
#
# Connecting workloads must present a LocalMesh-signed leaf cert whose CN
# matches the postgres role they're connecting as. CN-to-role binding IS
# the authorization gate; password auth is gone.
#
# TODO: needs_prod_decisions pg_hba cert-map for multi-workload roles via
# pg_ident.conf (e.g., one CN can serve multiple roles, multiple CNs can
# alias to one role). Today every workload that talks to postgres needs a
# CREATE ROLE line in initdb/00-roles.sql.

# TYPE  DATABASE   USER                ADDRESS         METHOD
local   all        all                                 trust
host    all        all                 127.0.0.1/32    trust
hostssl all        server              0.0.0.0/0       cert clientcert=verify-full
hostssl all        server              ::/0            cert clientcert=verify-full
hostssl all        postgres-exporter   0.0.0.0/0       cert clientcert=verify-full
hostssl all        postgres-exporter   ::/0            cert clientcert=verify-full
