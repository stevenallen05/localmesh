services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY}
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      metrics.service_name: redis
      metrics.module_name:  redis
      metrics.owned_by:     sre@example.com
