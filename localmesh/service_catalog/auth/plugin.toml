[identity]
module_name = "auth"
owned_by    = "sre@example.com"

[[services]]
container          = "dex"
port               = 5556
scheme             = "http"
expose_via_ingress = true       # browser hits dex.${PROJECT_NAME}.${LOCAL_DOMAIN} for the OIDC handshake
requires_auth      = false      # IdP can't gate itself
needs_mtls_sidecar = false
