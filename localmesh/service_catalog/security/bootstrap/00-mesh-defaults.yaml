type: Mesh
name: default
# Everywhere = both legacy `kuma.io/service` original-dst clusters AND
# MeshService VIPs. Apps dial peers by plain docker name (resolves to
# the pod IP via docker DNS); the legacy original-dst cluster mTLS-
# upgrades that path. Keeps apps mesh-agnostic.
meshServices:
  mode: Everywhere
---
type: MeshIdentity
mesh: default
name: default-identity
spec:
  selector:
    dataplane:
      matchLabels: {}
  spiffeID:
    trustDomain: "{{ .Mesh }}.mesh.local"
    path: "/workload/{{ .Workload }}"
  provider:
    type: Bundled
    bundled:
      meshTrustCreation: Enabled
      insecureAllowSelfSigned: true
      autogenerate:
        enabled: true
      certificateParameters:
        expiry: 24h
