[identity]
module_name = "mesh"
owned_by    = "sre@example.com"

# envoy-omakase. Replaces the prior caddy (north-south ingress + OIDC),
# ghostunnel (east-west mTLS sidecars), and oauth2-proxy (login flow)
# trio with one Envoy fleet across three roles: ingress, egress,
# per-workload sidecar. Per-workload sidecars are minted by the bundling CLI from
# templates/workload-sidecar.envoy.yaml.gotmpl. They do not appear as
# [[services]] entries here.

[[services]]
container          = "ingress-mesh"
port               = 8443
scheme             = "https"
ingress            = true
expose_via_ingress = false

[[services]]
container          = "egress-mesh"
# Transparent-egress port. Workload sidecars forward outbound to
# egress-mesh:15001 (catch-all). Internet destinations gated by the
# caller's mTLS cert + per-caller policy file.
port               = 15001
scheme             = "tcp"
ingress            = false
expose_via_ingress = false
