# Logging catalogue module — required.
#
# Shape: Loki for storage, otel-collector for ingest (filelog receiver +
# loki exporter, declared in the observability module so the collector
# stays a single binary). This module owns Loki and the Grafana data
# source; observability owns the receiver wiring.
#
# Compose → k8s portability:
#   - Compose tails docker's JSON log driver files at
#     /var/lib/docker/containers/*/*-json.log — bind-mounted into the
#     otel-collector. katenary translates the bind mount to a hostPath
#     volume, which works on k8s nodes, BUT the kubelet writes logs to
#     /var/log/containers/*.log instead. A helm overlay overrides the
#     filelog receiver's `include:` path post-conversion. See the
#     comment alongside the filelog config in observability/.
#   - Loki itself is environment-agnostic; same image, same port.

configs:
  loki_config:
    content: |
      # Single-instance, in-memory ring, filesystem storage. Fine for the
      # dev catalogue; prod overlay swaps storage_config to S3/GCS and
      # enables auth + multi-tenancy.
      auth_enabled: false
      server:
        http_listen_port: 3100
      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
      schema_config:
        configs:
          - from: 2024-04-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      # Default limits suit single-tenant local dev. Bump if the demo
      # generates more than ~4MB/s of logs.
      limits_config:
        allow_structured_metadata: true
      # By default Loki only promotes service.name from OTLP attributes to
      # an indexed label. Container scrapes don't have a service.name, so
      # query selectivity collapses to {service_name="unknown_service"}
      # without this. Container id has bounded cardinality (host-local).
      distributor:
        otlp_config:
          default_resource_attributes_as_index_labels:
            - container_id
            - module_name
            - owned_by
            - service                            # legacy JSON-stdout contract
            - service.name                       # OTel-canonical; APM dashboard queries by service_name
            - service.namespace
            - service.instance.id
            - deployment.environment.name
            - level
            # trace_id / span_id intentionally not indexed —
            # structured-metadata only (see observability filelog operators).

  # Vector log pipeline — runs in parallel with the otel-collector's filelog
  # receiver during chunks 3-4 (transient duplication); chunk 5 removes the
  # collector path so Vector is the sole log source. Spec §4.1.
  #
  # `.label."metrics.service_name"` field references are based on Vector's
  # documented docker_logs schema. If a fresh release flips the plural,
  # find/replace to `.labels.*` — flagged in spec §4.1.
  vector_config:
    content: |
      sources:
        docker:
          type: docker_logs
          docker_host: unix:///var/run/docker.sock
          # Restrict to containers in this compose project. The host may
          # also be running other containers we don't own.
          include_labels:
            - "com.docker.compose.project=${PROJECT_NAME}"

      transforms:
        # Agent-side identity enrichment — apps emit the envelope, the agent
        # supplies the resource attrs from container labels. Rules doc §3.
        enrich:
          type: remap
          inputs: ["docker"]
          source: |
            .service_name   = .label."metrics.service_name"
            .module_name    = .label."metrics.module_name"
            .owned_by       = .label."metrics.owned_by"
            .container_id   = .container_id
            .deployment_environment_name = "dev"
            del(.label)

      sinks:
        # Console-only this chunk. Chunk 4 swaps to the loki sink.
        console:
          type: console
          inputs: ["enrich"]
          encoding:
            codec: json

services:
  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    configs:
      - source: loki_config
        target: /etc/loki/loki.yaml
    volumes:
      - loki-data:/loki
    labels:
      # Internal-only port; katenary needs the explicit declaration to
      # generate the depends_on init-container in the helm chart.
      katenary.v3/ports: |-
        - 3100
      metrics.service_name: logging
      metrics.module_name: logging
      metrics.owned_by: sre@example.com
    # Loki image is distroless — no wget/curl/shell. Use service_started
    # ordering; the otel-collector's loki exporter will retry on its own
    # if Loki isn't accepting writes yet.

  vector:
    image: timberio/vector:0.46.0-debian
    container_name: vector
    configs:
      - source: vector_config
        target: /etc/vector/vector.yaml
    # Reading the docker socket needs either root or membership in the
    # host `docker` group. Same trade-off the otel-collector made for
    # /var/lib/docker access; mount is read-only.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      metrics.service_name: logging
      metrics.module_name: logging
      metrics.owned_by: sre@example.com
    depends_on:
      loki:
        condition: service_started

volumes:
  loki-data: {}
