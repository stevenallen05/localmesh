[identity]
module_name = "caddy"
owned_by    = "sre@example.com"

# Caddy IS the dev-facing ingress. Caddy doesn't route to itself; other
# services with expose_via_ingress=true get a route in the generated Caddyfile.

[[services]]
container          = "caddy"
port               = 8443
scheme             = "https"
ingress            = true
expose_via_ingress = false
