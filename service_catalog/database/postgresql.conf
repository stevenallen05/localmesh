# LocalMesh additions to the postgres defaults. Loaded via `-c
# config_file=...` in docker-compose.yml; the postgres image's own
# defaults still apply for everything else.

listen_addresses = '*'

# Native mTLS — required for every host connection except local Unix
# sockets. See pg_hba.conf for the per-row policy. The /etc/postgres-ssl/
# paths are postgres-owned copies the docker-compose entrypoint wrapper
# stamps from the LocalMesh bind-mount.
ssl              = on
ssl_cert_file    = '/etc/postgres-ssl/server.crt'
ssl_key_file     = '/etc/postgres-ssl/server.key'
ssl_ca_file      = '/etc/postgres-ssl/root.crt'

# TODO: needs_prod_decisions ssl_min_protocol_version + ssl_ciphers tightening
# (currently defaults are fine for dev; prod constrains to TLS 1.3 + an
# approved cipher list).
