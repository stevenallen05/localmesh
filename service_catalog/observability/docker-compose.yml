# Observability catalogue module — dev-local stub of the catalogue version.
# Included from the team's top-level docker-compose.yml.
#
# External env interface (consumed by team services in later chunks):
#   OTEL_EXPORTER_OTLP_ENDPOINT  http://otel-collector:4317
#   TSDB_URL                     http://victoriametrics:8428  (https in mTLS chunk)
#
# Host port map:
#   victoriametrics  8428  PromQL HTTP (reviewer-debug curl path)
#   grafana          3001  UI (in-container 3000)
#
# Healthchecks: only services whose images ship shell utilities get them.
# otel-collector, node-exporter, cadvisor ship distroless / FROM scratch
# bases — they use service_started for ordering.

configs:
  otel_collector_config:
    content: |
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        prometheus:
          config:
            scrape_configs:
              # `module_name` attributes each scrape job to the catalogue
              # module whose compose file declares it; `owned_by` names the
              # team accountable for the data. Other catalogue includes set
              # their own values on scrape jobs they own — app code uses
              # OTEL_RESOURCE_ATTRIBUTES on the container instead.
              - job_name: node-exporter
                # Host kernel metrics — dev-fidelity only. In prod, ops
                # owns the equivalent collectors and this scrape job is
                # removed by the prod overlay.
                static_configs:
                  - targets: ['node-exporter:9100']
                    labels:
                      module_name: observability
                      owned_by: sre@example.com
                scrape_interval: 30s
              - job_name: cadvisor
                static_configs:
                  - targets: ['cadvisor:8080']
                    labels:
                      module_name: observability
                      owned_by: sre@example.com
                scrape_interval: 30s
                metric_relabel_configs:
                  # Drop samples from containers outside this compose
                  # project (e.g. the dev-environment agentbox-*
                  # containers on the host daemon). Closes the TODO
                  # entry on cluster-health host noise.
                  - source_labels: [container_label_com_docker_compose_project]
                    regex: '${PROJECT_NAME}'
                    action: keep
                  # Stamp `service` from the docker label set by every
                  # compose service. Two-step fallback to container name —
                  # if the docker label is set, step 1 copies it and step
                  # 2's leading-semicolon-anchored regex no-ops; if the
                  # label is absent, step 1 produces empty and step 2's
                  # regex captures the container name.
                  - source_labels: [container_label_metrics_service_name]
                    target_label: service
                  - source_labels: [service, name]
                    separator: ';'
                    regex: ';(.+)'
                    target_label: service
                    replacement: '$1'
        # Tails the docker JSON log driver output for every container on
        # the host. The k8s overlay swaps this `include:` to
        # /var/log/containers/*.log (kubelet's path) — same receiver,
        # different glob. The bind mount declared on otel-collector's
        # `volumes:` (below) is what makes this readable; katenary
        # translates it to a hostPath volume.
        #
        # Filtering to this compose project would need docker_observer
        # enrichment (not a one-liner); dashboards filter by
        # `module_name` / `service.name` instead.
        filelog:
          include: ['/var/lib/docker/containers/*/*-json.log']
          start_at: end
          include_file_path: true
          operators:
            # Docker writes one JSON object per line: {"log","stream","time"}.
            - type: json_parser
              timestamp:
                parse_from: attributes.time
                layout: '%Y-%m-%dT%H:%M:%S.%LZ'
            # Extract the container id from the filename so dashboards can
            # filter by container without a separate enrichment step.
            - type: regex_parser
              regex: '^/var/lib/docker/containers/(?P<container_id>[^/]+)/'
              parse_from: attributes["log.file.path"]
            # Promote container_id to resource scope — Loki's OTLP endpoint
            # only indexes resource attributes as labels (see logging/
            # docker-compose.yml distributor.otlp_config).
            - type: move
              from: attributes.container_id
              to: resource["container_id"]
            # The actual log line — move out of attributes.log into body
            # so Loki's payload is the message itself.
            - type: move
              from: attributes.log
              to: body
            - type: move
              from: attributes.stream
              to: attributes["log.iostream"]
            # Cross-language structured-log contract. Apps emit JSON to
            # stdout with at minimum {timestamp, level, service, message,
            # trace_id, span_id, module_name, owned_by}. The json_parser
            # tries to parse the body; non-JSON lines (postgres, grafana,
            # etc.) pass through unchanged thanks to send_quiet.
            - type: json_parser
              parse_from: body
              parse_to: attributes
              on_error: send_quiet
            # tracing-subscriber (Rust) emits the root span's fields under
            # a nested `"span":{...}` object. json_parser preserves that as
            # a real nested map (NOT dotted-key flatten). Address via
            # `attributes.span.service` and lean on expr-lang's optional
            # chaining (`attributes.span?.service`) to make the `if:` guard
            # safe when there's no `span` key at all (non-JSON lines, or
            # Pino which emits service at top level).
            - type: move
              from: attributes.span.service
              to: attributes.service
              if: 'attributes.span?.service != nil'
            - type: move
              from: attributes.span.module_name
              to: attributes.module_name
              if: 'attributes.span?.module_name != nil'
            - type: move
              from: attributes.span.owned_by
              to: attributes.owned_by
              if: 'attributes.span?.owned_by != nil'
            - type: move
              from: attributes.span.trace_id
              to: attributes.trace_id
              if: 'attributes.span?.trace_id != nil'
            - type: move
              from: attributes.span.span_id
              to: attributes.span_id
              if: 'attributes.span?.span_id != nil'
            # Promote contract fields to resource scope. Loki's distributor
            # config (logging/docker-compose.yml) turns resource attrs into
            # indexed labels via default_resource_attributes_as_index_labels.
            # trace_id and span_id intentionally stay in attributes —
            # Loki accepts them as structured metadata (not indexed),
            # addressable in queries like {service="server"} | trace_id="abc"
            # without cardinality cost.
            - type: move
              from: attributes.service
              to: resource["service"]
              if: 'attributes.service != nil'
            - type: move
              from: attributes.level
              to: resource["level"]
              if: 'attributes.level != nil'
            - type: move
              from: attributes.module_name
              to: resource["module_name"]
              if: 'attributes.module_name != nil'
            - type: move
              from: attributes.owned_by
              to: resource["owned_by"]
              if: 'attributes.owned_by != nil'
      processors:
        # Stamps `project_name=${PROJECT_NAME}` on every span and log.
        # The value comes from .env's PROJECT_NAME, which mirrors
        # project.toml's identity block; once the platform reads
        # project.toml directly, this becomes a pure passthrough.
        resource/project:
          attributes:
            - key: project_name
              value: ${PROJECT_NAME}
              action: upsert
        # pg_tracing hard-codes service.name=PostgreSQL_Server and ignores
        # OTEL_RESOURCE_ATTRIBUTES, so the database module's resource attrs
        # land here at the collector instead of at the source. Rename to
        # `postgres` for dashboard cleanliness; stamp `module_name`/`owned_by`
        # to match the rest of the catalogue contract.
        transform/database:
          trace_statements:
            - context: resource
              statements:
                - set(attributes["module_name"], "database") where attributes["service.name"] == "PostgreSQL_Server"
                - set(attributes["owned_by"], "sre@example.com") where attributes["service.name"] == "PostgreSQL_Server"
                - set(attributes["service.name"], "postgres") where attributes["service.name"] == "PostgreSQL_Server"
        # Normalise log-level case. Rust's tracing-subscriber emits levels
        # uppercase ("INFO"); Pino + the contract use lowercase. Lowercasing
        # at the collector means the Loki label is consistent and dashboard
        # filters work without case-insensitive flags.
        transform/logs:
          log_statements:
            - context: resource
              statements:
                - set(attributes["level"], ConvertCase(attributes["level"], "lower")) where attributes["level"] != nil
      exporters:
        prometheusremotewrite:
          endpoint: http://victoriametrics:8428/api/v1/write
          # Same label, applied to every metric series at the remote-write
          # boundary. Surgical (one label) vs. resource_to_telemetry_conversion
          # which would dump every resource attr in as a Prom label.
          external_labels:
            project_name: ${PROJECT_NAME}
        debug:
          verbosity: detailed
        otlp/tempo:
          endpoint: tempo:4317
          tls:
            insecure: true
        # Loki push API. Container id + iostream become indexed labels;
        # the rest stays as structured metadata (cardinality control).
        otlphttp/loki:
          endpoint: http://loki:3100/otlp
          tls:
            insecure: true
      service:
        extensions: [health_check]
        pipelines:
          metrics:
            receivers: [otlp, prometheus]
            exporters: [prometheusremotewrite]
          traces:
            receivers: [otlp]
            processors: [transform/database, resource/project]
            exporters: [otlp/tempo, debug]
          logs:
            receivers: [filelog]
            processors: [resource/project, transform/logs]
            exporters: [otlphttp/loki]

  grafana_vm_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          uid: vm
          type: prometheus
          access: proxy
          url: http://victoriametrics:8428
          isDefault: true
          editable: false

  grafana_tempo_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Tempo
          uid: tempo
          type: tempo
          access: proxy
          url: http://tempo:3200
          editable: false
          jsonData:
            serviceMap:
              datasourceUid: vm

  grafana_loki_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki:3100
          editable: false
          jsonData:
            # Click through from a trace span to its container's logs.
            derivedFields:
              - name: TraceID
                matcherRegex: '"trace_id":"(\w+)"'
                url: '$${__value.raw}'
                datasourceUid: tempo

  tempo_config:
    content: |
      server:
        http_listen_port: 3200
      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/blocks
          wal:
            path: /var/tempo/wal
      metrics_generator:
        registry:
          external_labels:
            source: tempo
        storage:
          path: /var/tempo/generator/wal
          remote_write:
            - url: http://victoriametrics:8428/api/v1/write
              send_exemplars: true
        processor:
          service_graphs: {}
          # span_metrics emits traces_spanmetrics_{calls_total,latency_*} —
          # the RED side of the per-service dashboards. Default dimensions are
          # service / span_name / span_kind / status_code; `dimensions:` adds
          # the catalogue's resource attrs so dashboards can slice by module.
          span_metrics:
            dimensions:
              - module_name
              - owned_by
      overrides:
        defaults:
          metrics_generator:
            processors: [service-graphs, span-metrics]

  grafana_dashboards_provider:
    content: |
      apiVersion: 1
      providers:
        - name: default
          type: file
          options:
            path: /etc/grafana/dashboards

  grafana_bootstrap_script:
    # `$$` escapes the `$` from docker-compose interpolation — the rendered
    # file ends up with single `$` so /bin/sh sees normal shell variables.
    content: |
      #!/bin/sh
      # Assumes a fresh Grafana state — `make setup` runs `docker compose
      # down -v` first, so admin/admin is the default and no token name
      # collision is possible. See the Makefile note for the sledgehammer
      # caveat.
      set -eu
      TOKEN_FILE=/run/grafana/token
      GF="http://grafana:3000"
      AUTH="admin:admin"

      # curl -sS (no -f): always capture body, even on HTTP error, so we can
      # echo it for diagnostics. Detect failure by absence of expected field.
      CREATE_RESP=$$(curl -sS -u "$$AUTH" -H "Content-Type: application/json" \
              -X POST "$$GF/api/serviceaccounts" \
              -d '{"name":"rust-server","role":"Editor"}')
      SA_ID=$$(printf '%s' "$$CREATE_RESP" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -n1)
      if [ -z "$$SA_ID" ]; then
        echo "bootstrap: SA create returned: $$CREATE_RESP" >&2
        exit 1
      fi

      MINT_RESP=$$(curl -sS -u "$$AUTH" -H "Content-Type: application/json" \
              -X POST "$$GF/api/serviceaccounts/$$SA_ID/tokens" \
              -d '{"name":"rust-server-bootstrap"}')
      TOKEN=$$(printf '%s' "$$MINT_RESP" | sed -n 's/.*"key":"\([^"]*\)".*/\1/p')

      if [ -z "$$TOKEN" ]; then
        echo "bootstrap: token mint failed; grafana response: $$MINT_RESP" >&2
        exit 1
      fi

      printf '%s' "$$TOKEN" > "$$TOKEN_FILE"
      echo "bootstrap: token written to $$TOKEN_FILE"

  # Bookmark-worthy production-ops dashboards. Each is a JSON file under
  # ./dashboards/ — externalised because inlining gets unwieldy past a
  # couple of panels. The file provider configured above picks up
  # everything that lands in /etc/grafana/dashboards/.
  #
  # Roster (intentionally a small set, not a comprehensive library — ops
  # ships the starter shapes, teams fork into their own):
  #
  #   infra-modules    Catalogue overview — what's deployed, who owns it.
  #   cluster-health   Container roster + USE method (cpu/mem/net + throttle).
  #   service-glance   `$service` multi-select — RED + USE + service graph.
  #   service-logs     `$service` + level/regex controls scoped to logs.
  grafana_infra_modules_dashboard:
    file: ./dashboards/infra-modules.json
  grafana_cluster_health_dashboard:
    file: ./dashboards/cluster-health.json
  grafana_service_glance_dashboard:
    file: ./dashboards/service-glance.json
  grafana_service_logs_dashboard:
    file: ./dashboards/service-logs.json

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.152.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    labels:
      # Whole catalog module collapses to one row in service-glance.
      # See cadvisor metric_relabel_configs in this file.
      metrics.service_name: observability
    # Docker's JSON log files are 640 root:root; the contrib image's default
    # UID 10001 can't read them. Running root here is the trade-off every
    # node-local log scraper makes (Promtail/Alloy/filebeat all do the
    # same on k8s via DaemonSet privileges). Constrained to read-only mount.
    user: "0:0"
    configs:
      - source: otel_collector_config
        target: /etc/otelcol-contrib/config.yaml
    volumes:
      # Docker's JSON log driver output for every container on the host.
      # Read-only — the collector only tails, never writes. katenary
      # translates this to a hostPath volume in helm; the k8s overlay
      # also swaps the filelog `include:` path to /var/log/containers.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      victoriametrics:
        condition: service_started
      node-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
      loki:
        condition: service_started

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    labels:
      # No `ports:` block (internal-only — otel-collector scrapes 9100 over
      # the docker network). Katenary needs a port to generate the
      # depends_on readiness init-container; declare it here. See
      # https://repo.katenary.io/katenary/katenary/issues/182.
      katenary.v3/ports: |-
        - 9100
      metrics.service_name: observability

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    labels:
      # See node-exporter above — cadvisor serves the prometheus scrape on 8080.
      katenary.v3/ports: |-
        - 8080
      metrics.service_name: observability
    devices:
      - /dev/kmsg

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.0
    container_name: victoriametrics
    command:
      - '--storageDataPath=/victoria-metrics-data'
      - '--httpListenAddr=:8428'
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    labels:
      metrics.service_name: observability
    # No healthcheck: VM image is FROM scratch — no wget/curl/shell.
    # Reviewer-debug: `curl http://localhost:8428/health` from host.

  tempo:
    image: grafana/tempo:2.10.5
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    configs:
      - source: tempo_config
        target: /etc/tempo/tempo.yaml
    volumes:
      - tempo-data:/var/tempo
    labels:
      metrics.service_name: observability
    # Internal-only; Grafana proxies it. No healthcheck — Tempo's image
    # is minimal; rely on service_started for ordering.

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      # Required for the www page's iframe — Grafana otherwise sets
      # X-Frame-Options: SAMEORIGIN and the embed renders blank.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    configs:
      - source: grafana_vm_datasource
        target: /etc/grafana/provisioning/datasources/vm.yaml
      - source: grafana_tempo_datasource
        target: /etc/grafana/provisioning/datasources/tempo.yaml
      - source: grafana_loki_datasource
        target: /etc/grafana/provisioning/datasources/loki.yaml
      - source: grafana_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/default.yaml
      - source: grafana_infra_modules_dashboard
        target: /etc/grafana/dashboards/infra-modules.json
      - source: grafana_cluster_health_dashboard
        target: /etc/grafana/dashboards/cluster-health.json
      - source: grafana_service_glance_dashboard
        target: /etc/grafana/dashboards/service-glance.json
      - source: grafana_service_logs_dashboard
        target: /etc/grafana/dashboards/service-logs.json
    volumes:
      - grafana-data:/var/lib/grafana
    labels:
      metrics.service_name: observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      victoriametrics:
        condition: service_started

  grafana-bootstrap:
    image: curlimages/curl:8.10.1
    container_name: grafana-bootstrap
    # Profile-gated: `docker compose up` skips it. Invoked explicitly by
    # `make setup` via `docker compose run --rm grafana-bootstrap`, which
    # still honors depends_on so grafana is healthy before we hit the API.
    profiles: ["bootstrap"]
    # curlimages/curl runs as UID 100 by default; the grafana-token named
    # volume is created with root ownership and the curl_user can't write
    # to it. Short-lived container — root is fine here.
    user: root
    depends_on:
      grafana:
        condition: service_healthy
    configs:
      - source: grafana_bootstrap_script
        target: /bootstrap.sh
        mode: 0755
    volumes:
      - grafana-token:/run/grafana
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    labels:
      metrics.service_name: observability

volumes:
  vm-data: {}
  grafana-data: {}
  tempo-data: {}
  grafana-token: {}
