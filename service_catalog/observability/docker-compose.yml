# Observability catalogue module — dev-local stub of the catalogue version.
# Included from the team's top-level docker-compose.yml.
#
# External env interface (consumed by team services in later chunks):
#   OTEL_EXPORTER_OTLP_ENDPOINT  http://otel-collector:4317
#   TSDB_URL                     http://victoriametrics:8428  (https in mTLS chunk)
#
# Host port map:
#   victoriametrics  8428  PromQL HTTP (reviewer-debug curl path)
#   grafana          3001  UI (in-container 3000)
#
# Healthchecks: only services whose images ship shell utilities get them.
# otel-collector, node-exporter, cadvisor ship distroless / FROM scratch
# bases — they use service_started for ordering.

configs:
  otel_collector_config:
    content: |
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        prometheus:
          config:
            scrape_configs:
              # `catalog_source` attributes each scrape job to the module
              # whose compose file declares it. Other catalogue includes
              # set their own value (metrics-collector-<module>) on
              # scrape jobs they own — see redis/docker-compose.yml.
              - job_name: node-exporter
                static_configs:
                  - targets: ['node-exporter:9100']
                    labels:
                      catalog_source: metrics-collector-observability
                scrape_interval: 30s
              - job_name: cadvisor
                static_configs:
                  - targets: ['cadvisor:8080']
                    labels:
                      catalog_source: metrics-collector-observability
                scrape_interval: 30s
      processors:
        # Stamps `project_name=metrics-collector` on every span and log.
        # Hardcoded today — matches project.toml's identity block; once the
        # platform reads project.toml, this constant goes away.
        resource/project:
          attributes:
            - key: project_name
              value: metrics-collector
              action: upsert
      exporters:
        prometheusremotewrite:
          endpoint: http://victoriametrics:8428/api/v1/write
          # Same label, applied to every metric series at the remote-write
          # boundary. Surgical (one label) vs. resource_to_telemetry_conversion
          # which would dump every resource attr in as a Prom label.
          external_labels:
            project_name: metrics-collector
        debug:
          verbosity: detailed
        otlp/tempo:
          endpoint: tempo:4317
          tls:
            insecure: true
      service:
        extensions: [health_check]
        pipelines:
          # No `logs:` pipeline today — no source emits OTLP logs yet. When
          # one lands, add it here with processors: [resource/project] so
          # logs pick up the same project_name tag.
          metrics:
            receivers: [otlp, prometheus]
            exporters: [prometheusremotewrite]
          traces:
            receivers: [otlp]
            processors: [resource/project]
            exporters: [otlp/tempo, debug]

  grafana_vm_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: VictoriaMetrics
          uid: vm
          type: prometheus
          access: proxy
          url: http://victoriametrics:8428
          isDefault: true
          editable: false

  grafana_tempo_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Tempo
          uid: tempo
          type: tempo
          access: proxy
          url: http://tempo:3200
          editable: false
          jsonData:
            serviceMap:
              datasourceUid: vm

  tempo_config:
    content: |
      server:
        http_listen_port: 3200
      distributor:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/blocks
          wal:
            path: /var/tempo/wal
      metrics_generator:
        registry:
          external_labels:
            source: tempo
        storage:
          path: /var/tempo/generator/wal
          remote_write:
            - url: http://victoriametrics:8428/api/v1/write
              send_exemplars: true
        processor:
          service_graphs: {}
      overrides:
        defaults:
          metrics_generator:
            processors: [service-graphs]

  grafana_dashboards_provider:
    content: |
      apiVersion: 1
      providers:
        - name: default
          type: file
          options:
            path: /etc/grafana/dashboards

  grafana_bootstrap_script:
    # `$$` escapes the `$` from docker-compose interpolation — the rendered
    # file ends up with single `$` so /bin/sh sees normal shell variables.
    content: |
      #!/bin/sh
      # Assumes a fresh Grafana state — `make setup` runs `docker compose
      # down -v` first, so admin/admin is the default and no token name
      # collision is possible. See the Makefile note for the sledgehammer
      # caveat.
      set -eu
      TOKEN_FILE=/run/grafana/token
      GF="http://grafana:3000"
      AUTH="admin:admin"

      # curl -sS (no -f): always capture body, even on HTTP error, so we can
      # echo it for diagnostics. Detect failure by absence of expected field.
      CREATE_RESP=$$(curl -sS -u "$$AUTH" -H "Content-Type: application/json" \
              -X POST "$$GF/api/serviceaccounts" \
              -d '{"name":"rust-server","role":"Editor"}')
      SA_ID=$$(printf '%s' "$$CREATE_RESP" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -n1)
      if [ -z "$$SA_ID" ]; then
        echo "bootstrap: SA create returned: $$CREATE_RESP" >&2
        exit 1
      fi

      MINT_RESP=$$(curl -sS -u "$$AUTH" -H "Content-Type: application/json" \
              -X POST "$$GF/api/serviceaccounts/$$SA_ID/tokens" \
              -d '{"name":"rust-server-bootstrap"}')
      TOKEN=$$(printf '%s' "$$MINT_RESP" | sed -n 's/.*"key":"\([^"]*\)".*/\1/p')

      if [ -z "$$TOKEN" ]; then
        echo "bootstrap: token mint failed; grafana response: $$MINT_RESP" >&2
        exit 1
      fi

      printf '%s' "$$TOKEN" > "$$TOKEN_FILE"
      echo "bootstrap: token written to $$TOKEN_FILE"

  grafana_say_hello_dashboard:
    content: |
      {
        "uid": "say-hello",
        "title": "Demo placeholder",
        "schemaVersion": 39,
        "version": 1,
        "panels": [
          {
            "id": 1,
            "type": "text",
            "title": "Metrics TBD",
            "gridPos": { "h": 6, "w": 24, "x": 0, "y": 0 },
            "options": {
              "mode": "markdown",
              "content": "Application metrics have been removed pending re-design.\n\nInfra metrics from node-exporter and cadvisor still flow to VictoriaMetrics — see Grafana → Explore → VictoriaMetrics.\n\nTraces continue to flow to Tempo — see Grafana → Explore → Tempo, or the Service Graph view."
            }
          }
        ]
      }

  # Bookmark-worthy production-ops dashboards. Each one is a JSON file
  # under ./dashboards/ — externalised because inlining gets unwieldy
  # past a couple of panels. The file provider configured above picks
  # up everything that lands in /etc/grafana/dashboards/.
  grafana_host_health_dashboard:
    file: ./dashboards/host-health.json
  grafana_container_health_dashboard:
    file: ./dashboards/container-health.json
  grafana_service_health_dashboard:
    file: ./dashboards/service-health.json

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.152.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    configs:
      - source: otel_collector_config
        target: /etc/otelcol-contrib/config.yaml
    depends_on:
      victoriametrics:
        condition: service_started
      node-exporter:
        condition: service_started
      cadvisor:
        condition: service_started

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    labels:
      # No `ports:` block (internal-only — otel-collector scrapes 9100 over
      # the docker network). Katenary needs a port to generate the
      # depends_on readiness init-container; declare it here. See
      # https://repo.katenary.io/katenary/katenary/issues/182.
      katenary.v3/ports: |-
        - 9100

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    labels:
      # See node-exporter above — cadvisor serves the prometheus scrape on 8080.
      katenary.v3/ports: |-
        - 8080
    devices:
      - /dev/kmsg

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.0
    container_name: victoriametrics
    command:
      - '--storageDataPath=/victoria-metrics-data'
      - '--httpListenAddr=:8428'
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    # No healthcheck: VM image is FROM scratch — no wget/curl/shell.
    # Reviewer-debug: `curl http://localhost:8428/health` from host.

  tempo:
    image: grafana/tempo:2.10.5
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    configs:
      - source: tempo_config
        target: /etc/tempo/tempo.yaml
    volumes:
      - tempo-data:/var/tempo
    # Internal-only; Grafana proxies it. No healthcheck — Tempo's image
    # is minimal; rely on service_started for ordering.

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      # Required for the www page's iframe — Grafana otherwise sets
      # X-Frame-Options: SAMEORIGIN and the embed renders blank.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    configs:
      - source: grafana_vm_datasource
        target: /etc/grafana/provisioning/datasources/vm.yaml
      - source: grafana_tempo_datasource
        target: /etc/grafana/provisioning/datasources/tempo.yaml
      - source: grafana_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/default.yaml
      - source: grafana_say_hello_dashboard
        target: /etc/grafana/dashboards/say-hello.json
      - source: grafana_host_health_dashboard
        target: /etc/grafana/dashboards/host-health.json
      - source: grafana_container_health_dashboard
        target: /etc/grafana/dashboards/container-health.json
      - source: grafana_service_health_dashboard
        target: /etc/grafana/dashboards/service-health.json
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      victoriametrics:
        condition: service_started

  grafana-bootstrap:
    image: curlimages/curl:8.10.1
    container_name: grafana-bootstrap
    # Profile-gated: `docker compose up` skips it. Invoked explicitly by
    # `make setup` via `docker compose run --rm grafana-bootstrap`, which
    # still honors depends_on so grafana is healthy before we hit the API.
    profiles: ["bootstrap"]
    # curlimages/curl runs as UID 100 by default; the grafana-token named
    # volume is created with root ownership and the curl_user can't write
    # to it. Short-lived container — root is fine here.
    user: root
    depends_on:
      grafana:
        condition: service_healthy
    configs:
      - source: grafana_bootstrap_script
        target: /bootstrap.sh
        mode: 0755
    volumes:
      - grafana-token:/run/grafana
    entrypoint: ["/bin/sh", "/bootstrap.sh"]

volumes:
  vm-data: {}
  grafana-data: {}
  tempo-data: {}
  grafana-token: {}
