[identity]
module_name = "observability"
owned_by    = "sre@example.com"

# Observability containers are mesh-exempt — declared on compose labels.
# ingress-mesh routes to grafana via plain http (mesh-exempt — no upstream mTLS).
# Only the user-facing UIs need to be listed here; internal-only services
# (otel-collector, node-exporter, cadvisor, tempo, victoriametrics,
# grafana-bootstrap) are reached via the docker network and don't need an
# ingress route.

[[services]]
container          = "grafana"
port               = 3000
scheme             = "http"
expose_via_ingress = true
requires_auth      = false   # dashboards browsed openly in dev. TODO: needs_prod_decisions grafana auth via envoy in prod
