# Optional catalogue module — Redis cache.
# Teams pull this in for session storage, rate limiting, ephemeral state, etc.
# Same shape as the required modules: pinned image, healthcheck, named volume.
#
# Telemetry today: none — redis itself doesn't emit metrics. When a
# redis_exporter sidecar lands, its scrape job (added to the observability
# collector's scrape_configs, or routed via OTLP) sets
# `catalog_source: metrics-collector-redis` so this module's data stays
# attributable. See service_catalog/observability/docker-compose.yml for
# the pattern.

services:
  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data: {}
