# Dex base config — hand-written source. secrets-gen.py reads this,
# appends a `staticPasswords:` block (one entry per user from
# .secrets/users.yaml, all sharing the dev password "dev"), and writes
# the result to dex.yaml.generated, which is the file dex actually
# reads (dex's CLI accepts only one config file). Edit this file to
# tweak issuer / storage / staticClients; re-run `make certs` to
# regenerate.
#
# TODO: needs_prod_decisions swap built-in local connector for real OIDC IdP

issuer: https://dex.$PROJECT_NAME.$LOCAL_DOMAIN:8443/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true       # dev UX: skip the "Approve" click after login

# Built-in password DB. Pairs with the staticPasswords: block appended
# by secrets-gen.py. Issues ID tokens whose `preferred_username` claim
# is the staticPasswords[].username — oauth2-proxy forwards that as
# X-Auth-Request-Preferred-Username, which Caddy maps to
# X-Forwarded-Preferred-Username for the www banner.
enablePasswordDB: true

staticClients:
  - id:     localmesh-dev
    name:   "LocalMesh"
    secret: $LOCALMESH_OIDC_CLIENT_SECRET
    redirectURIs:
      - https://www.$PROJECT_NAME.$LOCAL_DOMAIN:8443/oauth2/callback

# `staticPasswords:` is appended by secrets-gen.py from .secrets/users.yaml.
