# Dex base config — hand-written source. secrets-gen.py reads this and
# concatenates it with one mockCallback connector per dev user (from
# .secrets/users.yaml), writing the result to dex.yaml.generated, which
# is the file dex actually reads (dex's CLI accepts only one config
# file). Edit this file to tweak issuer / storage / staticClients;
# re-run `make certs` to regenerate.
#
# TODO: needs_prod_decisions swap mock connectors for real OIDC IdP

issuer: https://dex.$PROJECT_NAME.$LOCAL_DOMAIN:8443/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true       # dev UX: don't make the user click "Approve" after picking a tile

staticClients:
  - id:     localmesh-dev
    name:   "LocalMesh"
    secret: $LOCALMESH_OIDC_CLIENT_SECRET
    redirectURIs:
      - https://www.$PROJECT_NAME.$LOCAL_DOMAIN:8443/oauth2/callback

# `connectors:` is appended by secrets-gen.py from .secrets/users.yaml.
