syntax = "proto3";
package metrics.v1;

import "google/protobuf/empty.proto";

// Metrics catalogue surface. Grafana-agnostic on the wire — dashboard
// URLs are paths only; clients prepend their public Grafana base.
service Catalog {
  rpc ListDataSources (ListDataSourcesRequest) returns (ListDataSourcesResponse);
  rpc GetDataSource   (GetDataSourceRequest)   returns (DataSource);

  rpc ListDashboards  (ListDashboardsRequest)  returns (ListDashboardsResponse);
  rpc GetDashboard    (GetDashboardRequest)    returns (Dashboard);
  // Create/Update accept Dashboard with `panel` oneof set. Only
  // `timeseries` is wired in v0; `stat` / `table` return UNIMPLEMENTED.
  // UpdateDashboard treats the request as full-replace (matches
  // Grafana's POST /api/dashboards/db with overwrite=true).
  rpc CreateDashboard (CreateDashboardRequest) returns (Dashboard);
  rpc UpdateDashboard (UpdateDashboardRequest) returns (Dashboard);
  rpc DeleteDashboard (DeleteDashboardRequest) returns (google.protobuf.Empty);

  rpc ListMetrics     (ListMetricsRequest)     returns (ListMetricsResponse);
}

message DataSource {
  string uid  = 1;
  string name = 2;
  string type = 3;   // "prometheus", "tempo", "loki", ...
  string url  = 4;
}

message Dashboard {
  string uid            = 1;
  string name           = 2;
  string dashboard_path = 3;   // "/d/{uid}"             — client prepends base
  string embed_path     = 4;   // "/d-solo/{uid}?panelId=1"

  // Set when the dashboard matches our single-panel single-query model.
  // Unset for multi-panel or unrecognized-panel-type dashboards.
  // NOTE on @grpc/proto-loader: the set variant appears as a property
  // on the message; readers should `if (d.timeseries) {...}`.
  oneof panel {
    TimeseriesPanel timeseries = 5;
    StatPanel       stat       = 6;
    TablePanel      table      = 7;
  }
}

message TimeseriesPanel { string datasource_uid = 1; string query = 2; }
message StatPanel       { string datasource_uid = 1; string query = 2; }
message TablePanel      { string datasource_uid = 1; string query = 2; }

message ListDataSourcesRequest  {}
message ListDataSourcesResponse { repeated DataSource data_sources = 1; }
message GetDataSourceRequest    { string uid = 1; }

message ListDashboardsRequest   {}
message ListDashboardsResponse  { repeated Dashboard dashboards = 1; }
message GetDashboardRequest     { string uid = 1; }
message CreateDashboardRequest  { Dashboard dashboard = 1; }   // uid ignored
message UpdateDashboardRequest  { Dashboard dashboard = 1; }   // uid required

message DeleteDashboardRequest  { string uid = 1; }

message ListMetricsRequest      { string datasource_uid = 1; }
message ListMetricsResponse     { repeated string names = 1; }
