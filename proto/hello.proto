syntax = "proto3";

package hello;

import "google/protobuf/empty.proto";

// v0 stub. Real MetricsIngest / MetricsQuery (see DESIGN_DECISIONS.md) land in
// their own spec; this is just enough proto to wire NextJS server -> Rust server,
// plus a demo postgres-stats RPC.
service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc PrintPostgresStats (google.protobuf.Empty) returns (PostgresStatsReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
  WhoAmI who_am_i = 2;       // surfaces mesh identity facts in the response payload
}

// Identity surface populated by the server from request extensions (set
// by the user + peer interceptors). Carried as response payload, not OTel
// span attribute — server-side handlers stay PII-clean per spec §9.3.
message WhoAmI {
  string mtls_peer_uri = 1;  // SPIFFE URI from the inbound TLS peer cert
  string user_id       = 2;  // from x-user-id gRPC metadata; "" if absent
  string user_email    = 3;
  string trace_id      = 4;  // current OTel trace, hex
}

message PostgresStatsReply {
  int32  num_backends    = 1;  // open connections
  int64  xact_commit     = 2;  // committed txns since stats reset
  int64  xact_rollback   = 3;  // rolled-back txns
  double cache_hit_ratio = 4;  // blks_hit / (blks_hit + blks_read)
  int64  db_size_bytes   = 5;  // pg_database_size(current_database())
}
